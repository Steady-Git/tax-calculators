<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 스케줄러</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Google Sheets 웹 앱 URL (여기서만 수정) ── */
  /* const GSHEET_URL = '...' 은 JS 최상단에 있습니다 */

  :root {
    --bg:      #f7f5f0;
    --surface: #ffffff;
    --ink:     #1c1c1e;
    --ink2:    #48484a;
    --muted:   #8e8e93;
    --line:    #e5e5ea;
    --red:     #d0021b;
    --blue:    #1a56db;
    --gold:    #b8860b;
    --amber:   #f5a623;
    --green:   #2c7a4b;
    --radius:  12px;
    --shadow:  0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100dvh;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--ink); color: #fff;
    padding: 14px 16px 14px;
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .header-left { display: flex; flex-direction: column; }
  .app-title { font-size: .95rem; font-weight: 700; letter-spacing: -.3px; }
  .app-subtitle {
    font-family: 'DM Mono', monospace; font-size: .55rem;
    color: rgba(255,255,255,.4); letter-spacing: 1.5px; margin-top: 2px;
  }
  .header-sync {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .sync-indicator {
    display: flex; align-items: center; gap: 5px;
    font-family: 'DM Mono', monospace; font-size: .58rem;
    color: rgba(255,255,255,.45); letter-spacing: .5px;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #555; flex-shrink: 0; transition: background .3s;
  }
  .sync-dot.ok      { background: #4cd964; }
  .sync-dot.err     { background: #ff3b30; }
  .sync-dot.loading { background: var(--amber); animation: blink .7s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .pull-btn {
    font-family: 'DM Mono', monospace; font-size: .62rem; font-weight: 500;
    background: rgba(255,255,255,.1); color: rgba(255,255,255,.75);
    border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap;
    transition: background .15s;
  }
  .pull-btn:hover { background: rgba(255,255,255,.18); }

  /* ── BODY ── */
  .app-body { max-width: 860px; margin: 0 auto; padding: 16px 14px 80px; }

  /* ── NAV HEADER ── */
  .nav-header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 18px; margin-bottom: 16px;
  }
  .nav-btn {
    width: 36px; height: 36px; border: none; background: var(--bg);
    border-radius: 50%; font-size: 1rem; cursor: pointer; color: var(--ink2);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .nav-btn:hover { background: var(--line); }
  .nav-center { text-align: center; flex: 1; }
  .nav-main {
    font-family: 'DM Mono', monospace; font-size: .88rem;
    font-weight: 600; color: var(--ink); letter-spacing: 1px;
  }
  .nav-sub {
    font-family: 'DM Mono', monospace; font-size: .58rem;
    color: var(--muted); letter-spacing: 1px; margin-top: 3px;
  }

  /* ── WEEK CARDS ── */
  .week-cards { display: flex; flex-direction: column; gap: 10px; }
  .day-card {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; overflow: hidden;
  }
  .day-card.today { box-shadow: 0 0 0 2.5px var(--gold), var(--shadow); }

  .day-card-aside {
    width: 72px; flex-shrink: 0; background: var(--bg);
    border-right: 1.5px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 16px 6px; gap: 2px;
  }
  .day-card.today       .day-card-aside { background: var(--gold); border-right-color: var(--gold); }
  .day-card.weekend-sat .day-card-aside { background: #f0f4ff; }
  .day-card.weekend-sun .day-card-aside { background: #fff5f5; }

  .day-aside-dow {
    font-family: 'DM Mono', monospace; font-size: .58rem;
    font-weight: 500; letter-spacing: 2px; color: var(--muted);
  }
  .day-card.today       .day-aside-dow { color: rgba(255,255,255,.8); }
  .day-card.weekend-sat .day-aside-dow { color: var(--blue); }
  .day-card.weekend-sun .day-aside-dow { color: var(--red); }

  .day-aside-num {
    font-family: 'DM Mono', monospace; font-size: 1.7rem;
    font-weight: 600; color: var(--ink); line-height: 1;
  }
  .day-card.today       .day-aside-num { color: #fff; }
  .day-card.weekend-sat .day-aside-num { color: var(--blue); }
  .day-card.weekend-sun .day-aside-num { color: var(--red); }

  .day-aside-md {
    font-family: 'DM Mono', monospace; font-size: .52rem; color: var(--muted);
  }
  .day-card.today .day-aside-md { color: rgba(255,255,255,.7); }
  .day-card-body { flex: 1; padding: 14px 18px; min-height: 110px; }

  /* ── TASK AREA ── */
  .task-input-wrap { display: flex; flex-direction: column; gap: 4px; }
  .task-item { display: flex; align-items: flex-start; gap: 6px; }
  .task-cb {
    width: 14px; height: 14px; flex-shrink: 0; margin-top: 3px;
    accent-color: var(--gold); cursor: pointer;
  }
  .task-text {
    flex: 1; border: none; background: transparent;
    font-family: 'Noto Sans KR', sans-serif; font-size: .78rem;
    color: var(--ink); resize: none; outline: none; line-height: 1.5;
    padding: 0; overflow: hidden;
  }
  .task-text.done { text-decoration: line-through; color: var(--muted); }
  .task-text::placeholder { color: var(--line); }
  .task-del {
    background: none; border: none; cursor: pointer;
    color: var(--line); font-size: .75rem; padding: 2px 3px;
    border-radius: 4px; flex-shrink: 0; transition: color .15s;
    margin-top: 1px;
  }
  .task-del:hover { color: var(--red); }
  .add-task-btn {
    align-self: flex-start; background: none; border: none; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: .62rem;
    color: var(--muted); letter-spacing: 1px; padding: 4px 0;
    transition: color .15s;
  }
  .add-task-btn:hover { color: var(--gold); }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    font-size: .78rem; padding: 9px 18px;
    border-radius: 20px; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── SWIPE HINT ── */
  @media (max-width: 600px) {
    .day-card-body { padding: 12px 14px; }
    .app-body { padding: 12px 10px 80px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="app-title">주간 스케줄러</div>
    <div class="app-subtitle">WEEKLY · PLANNER</div>
  </div>
  <div class="header-sync">
    <div class="sync-indicator">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncText">대기</span>
    </div>
    <button class="pull-btn" id="pullBtn">↓ 불러오기</button>
  </div>
</header>

<div class="app-body">
  <div class="nav-header">
    <button class="nav-btn" id="prevWeek">←</button>
    <div class="nav-center">
      <div class="nav-main" id="weekRangeLabel">────</div>
      <div class="nav-sub"  id="weekSubLabel">──</div>
    </div>
    <button class="nav-btn" id="nextWeek">→</button>
  </div>
  <div class="week-cards" id="weekCards"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
// ★ Google Sheets 웹 앱 URL (여기서 수정)
// ════════════════════════════════════════
const GSHEET_URL = 'https://script.google.com/macros/s/AKfycbxPqSbwjjMYcJx1aZAnlb6YQSlVvhcJfXE0j1sFa9hWpFXKWPlUH_dL7X9XnUOzHij9vQ/exec';

// ── Utils ──
const pad2 = n => String(n).padStart(2, '0');
const today = new Date();
const todayStr = `${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;
const DOW_EN = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Sync status ──
function setSyncStatus(state, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot' + (state ? ' ' + state : '');
  txt.textContent = text;
}

// ════════════════════════════════════════
// 로컬 스토리지
// ════════════════════════════════════════
const LS_PREFIX = 'wk_tasks_';   // week_YYYY-MM-DD
const LS_SYNCED = 'wk_synced';   // 마지막 동기화 시각

function localGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch { return null; }
}
function localSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── 전체 스냅샷 만들기 (Sheets 저장용) ──
// localStorage에서 week_ 로 시작하는 키 전부 모음
function buildSnapshot() {
  const result = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('week_')) {
      const v = localGet(k);
      if (v && v.length > 0) result[k] = v;
    }
  }
  return result;
}

// ── 스냅샷 복원 ──
function applySnapshot(snapshot) {
  Object.entries(snapshot).forEach(([k, v]) => localSet(k, v));
}

// ════════════════════════════════════════
// Google Sheets 연동
// ════════════════════════════════════════
let _isSyncing = false;

// Push: 로컬 → 시트 (비동기, 에러 무시)
async function pushToSheet() {
  if (!GSHEET_URL) return;
  _isSyncing = true;
  setSyncStatus('loading', '저장 중…');
  try {
    const snapshot = buildSnapshot();
    await fetch(GSHEET_URL, {
      method: 'POST',
      redirect: 'follow',
      body: JSON.stringify({ action: 'save', data: snapshot }),
    });
    const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    setSyncStatus('ok', `저장됨 ${now}`);
    localSet(LS_SYNCED, new Date().toISOString());
  } catch (e) {
    setSyncStatus('err', '저장 실패');
    console.warn('Sheets push 실패:', e);
  }
  _isSyncing = false;
}

// Pull: 시트 → 로컬 (명시적)
async function pullFromSheet() {
  if (!GSHEET_URL) { showToast('GSHEET_URL을 설정해주세요'); return; }
  setSyncStatus('loading', '불러오는 중…');
  try {
    const res  = await fetch(GSHEET_URL + '?action=load', { redirect: 'follow' });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    if (json.data && typeof json.data === 'object') {
      applySnapshot(json.data);
      localSet(LS_SYNCED, new Date().toISOString());
      renderWeek();
      const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      setSyncStatus('ok', `불러옴 ${now}`);
      showToast('☁ 클라우드에서 불러왔어요!');
    } else {
      setSyncStatus('ok', '데이터 없음');
      showToast('저장된 데이터가 없어요');
    }
  } catch (e) {
    setSyncStatus('err', '불러오기 실패');
    showToast('불러오기 실패: ' + e.message.slice(0, 30));
    console.warn('Sheets pull 실패:', e);
  }
}

// 변경 시 자동 push (디바운스 2초)
let _pushTimer = null;
function scheduleSync() {
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushToSheet, 2000);
}

// ════════════════════════════════════════
// 태스크 영역 빌드
// ════════════════════════════════════════
function buildTaskArea(storageKey) {
  const wrap = document.createElement('div');
  wrap.className = 'task-input-wrap';

  function redraw() {
    wrap.innerHTML = '';
    const tasks = localGet(storageKey) || [];
    tasks.forEach((t, idx) => {
      const row = document.createElement('div');
      row.className = 'task-item';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'task-cb'; cb.checked = t.done;
      cb.addEventListener('change', () => {
        const ts = localGet(storageKey) || [];
        ts[idx].done = cb.checked;
        localSet(storageKey, ts);
        ta.classList.toggle('done', cb.checked);
        scheduleSync();
      });

      const ta = document.createElement('textarea');
      ta.className = 'task-text' + (t.done ? ' done' : '');
      ta.value = t.text; ta.placeholder = '할 일 입력…'; ta.rows = 1;
      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
      });
      ta.addEventListener('blur', () => {
        const ts = localGet(storageKey) || [];
        if (ts[idx]) { ts[idx].text = ta.value; localSet(storageKey, ts); scheduleSync(); }
      });
      ta.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTask(); }
      });
      setTimeout(() => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }, 0);

      const del = document.createElement('button');
      del.className = 'task-del'; del.textContent = '✕';
      del.addEventListener('click', () => {
        const ts = localGet(storageKey) || [];
        ts.splice(idx, 1);
        localSet(storageKey, ts);
        scheduleSync();
        redraw();
      });

      row.appendChild(cb); row.appendChild(ta); row.appendChild(del);
      wrap.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-task-btn'; addBtn.textContent = '+ 추가';
    addBtn.addEventListener('click', addTask);
    wrap.appendChild(addBtn);
  }

  function addTask() {
    const ts = localGet(storageKey) || [];
    ts.push({ text: '', done: false });
    localSet(storageKey, ts);
    scheduleSync();
    redraw();
    setTimeout(() => {
      const all = wrap.querySelectorAll('.task-text');
      if (all.length) all[all.length - 1].focus();
    }, 10);
  }

  redraw();
  return wrap;
}

// ════════════════════════════════════════
// 주간 렌더링
// ════════════════════════════════════════
let weekOffset = 0;

function getMondayWeek(offset) {
  const base = new Date(today);
  const dow = (base.getDay() + 6) % 7;
  base.setDate(base.getDate() - dow + offset * 7);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i); days.push(d);
  }
  return days;
}

function getWeekNumber(d) {
  const j = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - j) / 86400000 + j.getDay() + 1) / 7);
}

function renderWeek() {
  const days = getMondayWeek(weekOffset);
  const first = days[0], last = days[6];
  const sy = first.getFullYear() === last.getFullYear();
  const sm = sy && first.getMonth() === last.getMonth();
  const rt = sm
    ? `${first.getFullYear()}년 ${first.getMonth()+1}월 ${first.getDate()}일 – ${last.getDate()}일`
    : sy
    ? `${first.getFullYear()}년 ${first.getMonth()+1}/${first.getDate()} – ${last.getMonth()+1}/${last.getDate()}`
    : `${first.getFullYear()}/${first.getMonth()+1}/${first.getDate()} – ${last.getFullYear()}/${last.getMonth()+1}/${last.getDate()}`;

  document.getElementById('weekRangeLabel').textContent = rt;
  document.getElementById('weekSubLabel').textContent =
    `${days[3].getFullYear()}년 제 ${getWeekNumber(days[3])}주차`;

  const wrap = document.getElementById('weekCards');
  wrap.innerHTML = '';
  days.forEach((d, i) => {
    const dk = `week_${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const isToday = dk === `week_${todayStr}`;
    const isSat = i === 5, isSun = i === 6;

    const card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' today' : '') + (isSat ? ' weekend-sat' : '') + (isSun ? ' weekend-sun' : '');

    const aside = document.createElement('div');
    aside.className = 'day-card-aside';
    aside.innerHTML = `
      <div class="day-aside-dow">${DOW_EN[i]}</div>
      <div class="day-aside-num">${d.getDate()}</div>
      <div class="day-aside-md">${d.getMonth()+1}/${d.getDate()}</div>`;

    const body = document.createElement('div');
    body.className = 'day-card-body';
    body.appendChild(buildTaskArea(dk));

    card.appendChild(aside);
    card.appendChild(body);
    wrap.appendChild(card);
  });
}

// ── Nav buttons ──
document.getElementById('prevWeek').addEventListener('click', () => { weekOffset--; renderWeek(); });
document.getElementById('nextWeek').addEventListener('click', () => { weekOffset++; renderWeek(); });
document.getElementById('pullBtn').addEventListener('click', pullFromSheet);

// ── Touch swipe for week nav ──
(function () {
  let sx = null;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 60 && e.target.closest('.week-cards')) {
      weekOffset += dx < 0 ? 1 : -1;
      renderWeek();
    }
    sx = null;
  }, { passive: true });
})();

// ── Init ──
renderWeek();

// 마지막 동기화 시각 표시
const lastSync = localGet(LS_SYNCED);
if (lastSync) {
  const t = new Date(lastSync).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  setSyncStatus('ok', `마지막 ${t}`);
} else {
  setSyncStatus('', '미연결');
}
</script>
</body>
</html>
