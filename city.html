<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한민국 시군구 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e4;
    --paper-dark:#ece3cd;
    --ink:#1f2d3d;
    --indigo:#2c4a63;
    --stamp-red:#c4442e;
    --gold:#b8863b;
    --line: rgba(31,45,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(184,134,59,0.07), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(196,68,46,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:36px 22px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
  }
  h1{
    font-family:'Song Myung', serif;
    font-size:30px;
    margin:8px 0 4px;
    text-align:center;
    letter-spacing:0.02em;
  }
  .sub{
    font-size:13px;
    color:rgba(31,45,61,0.6);
    margin-bottom:30px;
    text-align:center;
    line-height:1.6;
  }

  /* stamp card */
  .stage{
    width:100%;
    aspect-ratio:1/1;
    max-width:320px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:
      repeating-linear-gradient(135deg, rgba(31,45,61,0.03) 0 2px, transparent 2px 14px),
      var(--paper-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow: 0 1px 0 rgba(31,45,61,0.05), inset 0 0 0 6px var(--paper);
    overflow:hidden;
  }
  .stage::before,.stage::after{
    content:"";
    position:absolute;
    border:1px solid var(--line);
  }
  .stage::before{ inset:14px; border-radius:8px; }

  .stamp{
    position:relative;
    width:76%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:4px solid var(--stamp-red);
    color:var(--stamp-red);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    transform: rotate(-6deg) scale(0.9);
    opacity:0;
    transition: transform 0.45s cubic-bezier(.2,1.4,.4,1), opacity 0.3s ease;
  }
  .stamp.show{
    opacity:1;
    transform: rotate(-6deg) scale(1);
  }
  .stamp.spinning{
    opacity:0.9;
    animation: shake 0.09s infinite;
  }
  @keyframes shake{
    0%{ transform: rotate(-6deg) scale(0.97);}
    50%{ transform: rotate(-3deg) scale(1.0);}
    100%{ transform: rotate(-6deg) scale(0.97);}
  }
  .stamp-city{
    font-family:'Song Myung', serif;
    font-size:clamp(22px, 7vw, 34px);
    font-weight:400;
    line-height:1.25;
  }
  .stamp-placeholder{
    font-size:14px;
    color:rgba(31,45,61,0.35);
    font-weight:500;
  }

  .btn{
    margin-top:34px;
    padding:16px 40px;
    border:none;
    border-radius:999px;
    background:var(--indigo);
    color:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.05em;
    cursor:pointer;
    box-shadow: 0 3px 0 rgba(31,45,61,0.25);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(31,45,61,0.25);
  }
  .btn:disabled{ opacity:0.55; cursor:default; }

  .count{
    margin-top:14px;
    font-size:12px;
    color:rgba(31,45,61,0.55);
    letter-spacing:0.04em;
  }

  .history{
    width:100%;
    margin-top:38px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .history h2{
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:rgba(31,45,61,0.5);
    font-weight:700;
    margin:0 0 12px;
  }
  .history-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-size:13px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .empty{
    font-size:13px;
    color:rgba(31,45,61,0.4);
  }

  .reset{
    margin-top:16px;
    background:none;
    border:none;
    font-size:12px;
    color:var(--stamp-red);
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }

  footer{
    margin-top:40px;
    font-size:11px;
    color:rgba(31,45,61,0.35);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Korea · 161</div>
    <h1>어디로 가볼까?</h1>
    <p class="sub">전국 시·군·구 중 하나를 무작위로 뽑아드려요.<br>도장을 찍듯 눌러보세요.</p>

    <div class="stage">
      <div class="stamp" id="stamp">
        <span class="stamp-placeholder" id="stampText">뽑기 전</span>
      </div>
    </div>

    <button class="btn" id="drawBtn">도장 찍기</button>
    <div class="count" id="countText"></div>

    <div class="history">
      <h2>뽑은 기록</h2>
      <div class="history-list" id="historyList">
        <span class="empty">아직 뽑은 지역이 없어요.</span>
      </div>
      <button class="reset" id="resetBtn">기록 초기화</button>
    </div>

    <footer>지역 목록은 mykoreamap.com 지도 기준 (161개 시·군·구)</footer>
  </div>

<script>
const CITIES = [
  // 강원도 (18)
  "철원","화천","양구","인제","고성(강원)","춘천","홍천","횡성","평창","정선","영월","원주","강릉","동해","삼척","태백","속초","양양",
  // 서울/인천/경기도 (32)
  "서울","인천","김포","고양","파주","연천","포천","동두천","양주","의정부","남양주","구리","하남","성남","광주(경기)","여주","이천","용인","수원","화성","오산","평택","안성","안양","과천","군포","의왕","시흥","부천","안산","가평","양평",
  // 충청북도 (11)
  "제천","단양","충주","음성","진천","괴산","증평","청주","보은","옥천","영동",
  // 충청남도 (17)
  "천안","아산","당진","서산","태안","홍성","예산","청양","보령","서천","부여","논산","계룡","공주","금산","세종","대전",
  // 경상북도 (23)
  "문경","상주","예천","영주","봉화","울진","안동","의성","청송","영양","영덕","포항","경주","구미","김천","칠곡","성주","고령","청도","경산","영천","울릉","대구",
  // 경상남도 (20)
  "거창","합천","창녕","밀양","양산","함양","산청","의령","함안","창원","김해","부산","울산","진주","하동","사천","남해","고성(경남)","통영","거제",
  // 전라북도 (14)
  "군산","익산","김제","전주","완주","진안","무주","장수","임실","순창","남원","정읍","고창","부안",
  // 전라남도 (23)
  "영광","장성","담양","곡성","구례","함평","광주(전남)","나주","화순","순천","광양","여수","무안","목포","영암","보성","신안","장흥","강진","고흥","해남","진도","완도",
  // 제주 (2)
  "제주","서귀포"
];

const stamp = document.getElementById('stamp');
const stampText = document.getElementById('stampText');
const drawBtn = document.getElementById('drawBtn');
const countText = document.getElementById('countText');
const historyList = document.getElementById('historyList');
const resetBtn = document.getElementById('resetBtn');

let history = [];

function updateCount(){
  countText.textContent = `총 ${CITIES.length}개 지역 중 뽑기`;
}
updateCount();

function renderHistory(){
  if(history.length === 0){
    historyList.innerHTML = '<span class="empty">아직 뽑은 지역이 없어요.</span>';
    return;
  }
  historyList.innerHTML = history
    .map(c => `<span class="chip">${c}</span>`)
    .join('');
}

function draw(){
  drawBtn.disabled = true;
  stamp.classList.remove('show');
  stamp.classList.add('spinning');
  stampText.classList.remove('stamp-city');
  stampText.classList.add('stamp-placeholder');

  let ticks = 0;
  const maxTicks = 14;
  const interval = setInterval(() => {
    const random = CITIES[Math.floor(Math.random() * CITIES.length)];
    stampText.textContent = random;
    ticks++;
    if(ticks >= maxTicks){
      clearInterval(interval);
      const finalCity = CITIES[Math.floor(Math.random() * CITIES.length)];
      stampText.textContent = finalCity;
      stampText.classList.remove('stamp-placeholder');
      stampText.classList.add('stamp-city');
      stamp.classList.remove('spinning');
      stamp.classList.add('show');
      history.unshift(finalCity);
      if(history.length > 20) history.pop();
      renderHistory();
      drawBtn.disabled = false;
    }
  }, 60);
}

drawBtn.addEventListener('click', draw);
resetBtn.addEventListener('click', () => {
  history = [];
  renderHistory();
});
</script>
</body>
</html>
