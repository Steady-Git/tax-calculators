<title>목공예기능사 CBT 3회분</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg: #E9E4D6;
    --surface: #FBF9F3;
    --surface-2: #F1ECDE;
    --ink: #262119;
    --ink-muted: #6E6455;
    --ink-faint: #9A9080;
    --border: #DBD2BC;
    --border-strong: #C7BB9E;
    --accent: #A0591F;
    --accent-ink: #FFF8EE;
    --accent-soft: #F3E2CC;
    --correct: #3E7A56;
    --correct-bg: #E3EFE3;
    --correct-border: #A9CBAE;
    --incorrect: #AE3B2E;
    --incorrect-bg: #F5E3DF;
    --incorrect-border: #DCB2A6;
    --shadow: 0 1px 2px rgba(38,33,25,0.06), 0 6px 20px -12px rgba(38,33,25,0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1712;
      --surface: #24201A;
      --surface-2: #2B261E;
      --ink: #EEE7D9;
      --ink-muted: #B3A793;
      --ink-faint: #7C7261;
      --border: #3A3226;
      --border-strong: #4A4030;
      --accent: #E0913F;
      --accent-ink: #1B1712;
      --accent-soft: #3A2E1C;
      --correct: #7BC195;
      --correct-bg: #1E2E23;
      --correct-border: #3C5C46;
      --incorrect: #E6897B;
      --incorrect-bg: #332019;
      --incorrect-border: #5C382E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px -12px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1B1712;
    --surface: #24201A;
    --surface-2: #2B261E;
    --ink: #EEE7D9;
    --ink-muted: #B3A793;
    --ink-faint: #7C7261;
    --border: #3A3226;
    --border-strong: #4A4030;
    --accent: #E0913F;
    --accent-ink: #1B1712;
    --accent-soft: #3A2E1C;
    --correct: #7BC195;
    --correct-bg: #1E2E23;
    --correct-border: #3C5C46;
    --incorrect: #E6897B;
    --incorrect-bg: #332019;
    --incorrect-border: #5C382E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 24px -12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-soft); }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 120px;
  }

  header.top {
    padding: 44px 20px 28px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface-2), var(--bg));
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 700;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .sub {
    color: var(--ink-muted);
    font-size: 14.5px;
    margin: 0;
  }

  /* sticky control bar */
  .bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .bar-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 10px 20px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .nav-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }
  .pill {
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 11px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .pill:hover { border-color: var(--border-strong); color: var(--ink); }
  .pill.round { font-weight: 700; }

  .progress-track {
    flex-basis: 100%;
    height: 4px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }

  .stat {
    font-size: 12.5px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stat b { color: var(--ink); font-weight: 700; }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:focus-visible, .pill:focus-visible, .choice:focus-visible, .reveal-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* round header */
  .round-head {
    margin: 56px 0 6px;
    padding-top: 18px;
    border-top: 3px solid var(--accent);
    scroll-margin-top: 92px;
  }
  .round-head:first-child { margin-top: 30px; }
  .round-head h1.round-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    font-weight: 700;
    margin: 10px 0 4px;
  }
  .round-head .round-sub {
    color: var(--ink-muted);
    font-size: 13px;
    margin: 0 0 10px;
  }
  .round-jump {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .round-jump a {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }
  .round-jump a:hover { color: var(--accent); border-color: var(--accent); }

  /* section headers */
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 18px;
    padding-top: 8px;
    scroll-margin-top: 92px;
  }
  .section-head .num {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 5px;
  }
  .section-head h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 19px;
    font-weight: 700;
    margin: 0;
  }
  .section-head .range {
    color: var(--ink-faint);
    font-size: 12.5px;
    margin-left: auto;
  }

  /* question card */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 20px 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    scroll-margin-top: 92px;
  }
  .q-head {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .q-no {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
  }
  .q-text {
    font-size: 16px;
    line-height: 1.55;
    font-weight: 500;
    padding-top: 3px;
  }

  .diagram {
    margin: 4px 0 16px 42px;
    padding: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: inline-flex;
    gap: 22px;
    flex-wrap: wrap;
  }
  .diagram svg { display: block; }
  .diagram figure { margin: 0; text-align: center; }
  .diagram figcaption {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-left: 42px;
  }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    text-align: left;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.45;
  }
  .choice:hover:not(.locked) { border-color: var(--border-strong); background: var(--surface-2); }
  .choice .mark {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .choice.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .choice.selected .mark { color: var(--accent); }

  .choice.is-correct {
    border-color: var(--correct-border);
    background: var(--correct-bg);
  }
  .choice.is-correct .mark { color: var(--correct); }
  .choice.is-wrong {
    border-color: var(--incorrect-border);
    background: var(--incorrect-bg);
  }
  .choice.is-wrong .mark { color: var(--incorrect); }
  .choice.locked { cursor: default; }
  .choice .tag {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 100px;
  }
  .choice.is-correct .tag { background: var(--correct); color: var(--accent-ink); }
  .choice.is-wrong .tag { background: var(--incorrect); color: var(--accent-ink); }

  .q-foot {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0 0 42px;
    min-height: 20px;
  }
  .reveal-link {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: transparent;
  }
  .reveal-link:hover { text-decoration-color: var(--accent); }

  .result-flag {
    font-size: 12.5px;
    font-weight: 700;
  }
  .result-flag.ok { color: var(--correct); }
  .result-flag.no { color: var(--incorrect); }

  .explain {
    margin: 12px 0 0 42px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-muted);
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: var(--ink); font-weight: 700; }
  .explain .ans-line {
    color: var(--ink);
    font-weight: 700;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .explain .ans-line .num { color: var(--correct); }

  /* score summary */
  .summary {
    display: none;
    margin: 46px 0;
    padding: 26px 24px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .summary.show { display: block; }
  .summary .score {
    font-family: 'Noto Serif KR', serif;
    font-size: 42px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 2px;
  }
  .summary .score span { color: var(--ink-faint); font-size: 24px; }
  .summary .badge {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 100px;
    margin-top: 10px;
  }
  .summary .badge.pass { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct-border); }
  .summary .badge.fail { background: var(--incorrect-bg); color: var(--incorrect); border: 1px solid var(--incorrect-border); }
  .summary .note { color: var(--ink-muted); font-size: 12.5px; margin-top: 12px; }
  .summary .breakdown {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .summary .breakdown div { text-align: center; }
  .summary .breakdown .bnum {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .summary .breakdown .blabel {
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  footer.end {
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
    margin-top: 40px;
    padding-bottom: 10px;
  }

  @media (max-width: 480px) {
    .diagram, .choices, .q-foot, .explain { margin-left: 0; }
    .q-text { font-size: 15px; }
  }
</style>

<header class="top">
  <div class="eyebrow">목공예기능사 필기 · CBT 대비 실전문제</div>
  <h1>제1~3회 모의고사</h1>
  <p class="sub">3회분 · 총 180문항 — 정답을 고르면 바로 채점하거나, 끝까지 푼 뒤 한 번에 채점하세요</p>
</header>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-row">
      <div class="nav-pills" id="navPills"></div>
      <span class="stat" id="answeredStat"><b>0</b>/180 응답</span>
      <button class="btn" id="resetBtn">초기화</button>
      <button class="btn primary" id="gradeBtn">채점하기</button>
    </div>

  </div>
</div>

<div class="wrap">
  <div class="summary" id="summary">
    <div class="eyebrow">채점 결과</div>

    <div class="breakdown" id="scoreBreakdown"></div>
    <p class="note">목공예기능사 필기는 100점 만점 중 60점 이상이면 합격입니다 (회차별 60문항 환산 기준).</p>
  </div>
  <div id="sections"></div>
</div>

<footer class="end">스캔한 실전문제집을 바탕으로 정리한 학습용 페이지입니다.</footer>

<script>
const ROUNDS = [
  { name: "제1회", sections: ["목제품 디자인","목공예 재료","목공예"] },
  { name: "제2회", sections: ["목제품 디자인","목공예 재료","목공예"] },
  { name: "제3회", sections: ["목제품 디자인","목공예 재료","목공예"] }
];

// r: round index (0,1,2)  s: section index within round (0,1,2)
const DATA = [
// ============ 제1회 · 1과목 목제품 디자인 ============
{ r:0, s:0, q:"의장의 원리 중 율동미와 관계가 가장 먼 것은?", ch:["연속의 원리","점층의 원리","반복의 원리","대칭의 원리"], a:3, ex:"대칭의 원리는 균형(밸런스)과 관계가 있다." },
{ r:0, s:0, q:"조형의 요소인 선과 형, 색채 등이 하나의 질서를 가지고 반복될 때 느껴지는 감각을 무엇이라 하는가?", ch:["균제","균형","율동","대조"], a:2, ex:"율동은 유사한 디자인 요소가 규칙적이거나 주기적으로 반복될 때 나타난다." },
{ r:0, s:0, q:"도면에서 평면도, 배치도 등은 원칙적으로 어느 방향을 위로 하여 제도하는가?", ch:["동","서","남","북"], a:3, ex:"평면도·배치도는 원칙적으로 북쪽을 위로 하여 제도한다." },
{ r:0, s:0, q:"디자인 요소 중 통일과 가장 관계가 있는 것은?", ch:["집중","대비","불협화","전이"], a:0, ex:"통일은 실내디자인의 여러 요소를 서로 같거나 일치되게 구성하여 공통점이 있도록 느껴지게 하는 것이다." },
{ r:0, s:0, q:"다음 중 대비의 종류가 다른 것은?", ch:["①번 도형쌍","②번 도형쌍","③번 도형쌍","④번 도형쌍"], a:3, ex:"①·②·③은 모두 직선형과 곡선형이 섞이거나 같은 계열의 도형을 회전·변형시킨 조합인 반면, ④는 완전한 곡선(원)과 완전한 직선(정사각형)을 짝지어 성질이 뚜렷이 다른 형태 대비를 이룬다.", diagram:"r1q5" },
{ r:0, s:0, q:"산업안전표지판 색상을 정할 때 색이 가지는 광선의 반사율과 주변과의 대비색을 고려하여 결정한 사항으로 관계가 없는 것은?", ch:["노란색 바탕 – 검은색","검은색 바탕 – 노란색","흰색 바탕 – 빨간색","녹색 바탕 – 검은색"], a:3, ex:"녹색 바탕에는 검은색이 아니라 빨간색이 대비색으로 짝지어진다." },
{ r:0, s:0, q:"평면 구성을 할 경우 일정한 길이의 선이나 형태가 규칙적으로 반복되었을 때 나타나는 효과는?", ch:["율동감","균형감","재질감","변화감"], a:0, ex:"일정한 길이의 선·형태가 규칙적으로 반복되면 율동감이 나타난다." },
{ r:0, s:0, q:"디자인에서 율동감을 나타내려고 할 때의 형식은 어떤 것들이 있는가?", ch:["단순, 변화, 강조","종속, 우세","대비, 대조, 조화","강조, 반복, 점층"], a:3, ex:"율동감의 형식에는 강조, 반복, 점층이 있다." },

{ r:1, s:0, q:"낙랑 문화의 특징으로 대표적인 것은?", ch:["유교 사상이 표현된 채화칠협","굽이 높은 고배형의 토기","다채로운 문양의 금동 불상","누금 세공법에 의한 순금 공예"], a:0, ex:"채화칠협은 서기 1~2세기 낙랑 시대 무덤인 채협총에서 출토된 약 40cm 길이의 대나무 광주리로, 유교 사상이 표현된 인물화가 그려져 있다." },
{ r:1, s:0, q:"다음 중 조선 시대 목·죽공예의 독특한 공예미는?", ch:["귀족적이고 화려함","세련되고 매끄러움","건실한 구조와 실용성","모방적 꾸밈성"], a:2, ex:"조선 시대 목·죽공예는 화려한 장식보다 건실한 구조와 실용성을 중시하는 소박한 공예미를 지닌다." },
{ r:1, s:0, q:"신문지나 색종이, 헝겊 등 각각 다른 재질감을 이용하는 디자인 제작 기법은?", ch:["마블링","콜라주","포토 몽타주","배수법"], a:1, ex:"콜라주는 화면에 종이·인쇄물·사진 등을 오려 붙이고 일부를 가필하여 작품을 만드는 디자인 제작 기법으로 광고, 포스터 등에 많이 이용한다." },

{ r:1, s:1, q:"건조한 목재를 수증기 중에 방치하면 수분이 세포막에 흡수되는데, 이때 더 이상 흡수할 수 없는 한계에 이를 때의 함수율을 무엇이라 하는가?", ch:["섬유 포화점","기건 함수율","섬유 한계점","전건상태"], a:0, ex:"섬유 포화점은 목재 세포벽이 수분으로 최대한 포화되고 세포 내강에는 자유수가 없는 상태의 함수율(약 30%)을 말한다." },
{ r:1, s:1, q:"단판에 대한 설명으로 옳은 것은?", ch:["두께가 약 5mm 이하인 얇은 판이다.","얇게 켠 나무를 교차시켜 접착한 것이다.","판재 표면을 가공하여 미려하게 한 것이다.","목재를 세편화하여 성형한 것이다."], a:0, ex:"단판(veneer)은 원목을 얇게 절삭하여 만든, 두께 약 5mm 이하의 얇은 판을 말한다." },
{ r:1, s:1, q:"목재의 장점에 관한 설명이 아닌 것은?", ch:["가공이 쉽다.","구하기 쉽다.","열, 전기적으로 부도체이다.","재질이 균일하다."], a:3, ex:"목재는 부위·수종에 따라 재질이 균일하지 않다는 단점이 있다." },

{ r:1, s:1, q:"목재의 횡단면에서 춘재부와 추재부로 인해 나타난 동심원 형태의 조직은?", ch:["수선","나이테","곧은결","무늿결"], a:1, ex:"춘재(봄~여름에 생장한 세포)와 추재(가을~겨울에 생장한 세포)가 번갈아 만들어내는 동심원 무늬가 나이테이다." },
{ r:1, s:1, q:"수액이 가장 적고 건조가 빠르며 목질도 견고하여 벌채하기 가장 좋은 시기는?", ch:["봄, 여름","여름, 가을","가을, 겨울","겨울, 봄"], a:2, ex:"운반이 쉽고 임금이 저렴한 늦가을에서 겨울이 벌채하기 좋은 시기이다." },
{ r:1, s:1, q:"도막의 결성성분을 용해하는 용제로 알맞지 않은 것은?", ch:["석유계","알코올계","물","동물성 기름"], a:3, ex:"일반적으로 유기용제(알코올, 탄화수소, 에스테르, 에테르, 아세톤, 벤젠, 테레빈유 등)를 사용하며, 수성 도료의 경우 물을 사용한다. 동물성 기름은 도막 결성성분의 용제로 쓰이지 않는다." },
{ r:1, s:1, q:"접착제에 의한 접합 시 이상적인 접착층의 두께는?", ch:["0.02mm","0.06mm","0.6mm","0.2mm"], a:1, ex:"목재의 접착층은 0.06mm 정도의 막과 같은 모양을 이루는 상태가 가장 좋다." },
{ r:1, s:1, q:"다음 중 래커 바탕칠에 관한 사항 중 틀린 것은?", ch:["희석제로 에나멜 시너를 약간 혼합하여 사용한다.","퍼티(putty)는 프라이머 면에 바탕의 요철을 고르고, 건조 후 연마하여 평활하게 한다.","서피서(surfacer)는 칠한 면을 평활하게 하는 것으로 흰색도 있다.","프라이머(primer)는 바탕과의 부착이 잘 되게 한다."], a:0, ex:"퍼티는 목공품의 균열을 막거나 못질 마무리에서 구멍을 채울 때, 서피서는 불규칙한 표면을 채우는 샌딩이 쉬운 페인트, 프라이머는 밑바탕에 맨 처음 칠해 부착성을 높이는 도료이다. 희석제로 에나멜 시너를 섞는다는 설명은 틀린 내용이다." },
{ r:1, s:1, q:"심재의 특성이 아닌 것은?", ch:["변재에 비해 비중이 높다.","변재에 비해 내구성이 높다.","변재에 비해 탄력성이 높다.","변재에 비해 갈라지기 쉽다."], a:2, ex:"심재는 수분이 적어 수축 변형이 작고 단단하므로 탄력성이 오히려 낮다." },
{ r:1, s:1, q:"목재의 제재계획에서 침엽수의 취재율로 적당한 것은?", ch:["30% 이상","40% 이상","50% 이상","70% 이상"], a:3, ex:"침엽수의 취득률(취재율)은 60~90%로, 70% 이상이 적당하다." },

{ r:1, s:2, q:"다음 중 안쪽 곡면을 깎을 때 주로 사용하는 대패는?", ch:["턱대패","배대패","옆대패","홈대패"], a:1, ex:"배대패는 밑면이 배 모양으로 되어 있어 호의 크기를 다양하게 만들어 곡면을 깎는 데 사용한다." },

{ r:1, s:2, q:"그무개의 용도에 해당하지 않는 것은?", ch:["쪼개기","직각선 그리기","평행선 긋기","장부의 두께 표시"], a:1, ex:"줄 그무개는 기준면에 평행선을 긋고, 쪼개기 그무개는 기준면과 나란히 쪼개며, 장부 그무개는 장부의 두께를 표시한다. 직각선 그리기는 그무개의 용도가 아니다." },

{ r:1, s:2, q:"다음 조각도 중 가장 많이 쓰이는 칼로, 파내거나 베는 데 쓰는 것은?", ch:["평도","환도","삼각도","인도"], a:3, ex:"창칼(인도)은 조각도 중 가장 많이 사용되는 칼로, 대개 날카로운 선이나 세밀한 부분을 파낼 때 사용한다." },

{ r:1, s:2, q:"다음 중 띠톱기계(band saw)와 둥근톱기계(circular saw)를 사용하여 톱날 가까이까지 목재를 밀어 넣을 때 안전한 방법은?", ch:["손으로 직접 밀어 넣는다.","장갑을 끼고 밀어 넣는다.","보조막대로 밀어 넣는다.","톱날의 회전 속도를 줄인다."], a:2, ex:"손이 톱날에 가까워지는 것을 막기 위해 보조막대(밀대)를 사용해 밀어 넣는 것이 안전하다." },
{ r:1, s:2, q:"목재에 홈을 파고 턱을 만들며 성형 절삭을 할 수 있는 기계는?", ch:["휴대용 전동 대패","휴대용 둥근톱","휴대용 루터","에지포머"], a:2, ex:"휴대용 전동 대패는 평면·직각면을, 휴대용 둥근톱은 절단·홈파기를 주로 하며, 휴대용 루터는 홈파기·턱 만들기·성형 절삭을 할 수 있다." },
{ r:1, s:2, q:"아교에 대한 설명으로 틀린 것은?", ch:["아교는 반투명체이며 황색이고, 광택이 있어야 한다.","맑은 물에 4~24시간 동안 담가두었다가 사용한다.","50℃ 정도의 더운물에 1~3시간 녹인다.","아교의 붙는 힘은 20℃가 표준이다."], a:3, ex:"아교의 접착력은 온도에 따라 달라지며, 50℃ 정도의 더운물에서 녹여 사용하는 것이 일반적이다." },
{ r:1, s:2, q:"느티나무와 같은 굳은 나무를 평칼로 조각할 때, 앞날의 경사각으로 가장 적합한 것은?", ch:["10~15°","15~20°","20~30°","35~40°"], a:3, ex:"굳은 나무는 칼몸이 보통 칼보다 두껍고 앞날의 경사각이 35~40°인 것이 가장 좋다." },
{ r:1, s:2, q:"안전점검을 하는 가장 큰 목적은?", ch:["기준에 위배되는지 조사하는 데 있다.","위험한 부분을 발견하여 미리 시험하는 데 있다.","장비의 안전 설계를 조사하는 데 있다.","안전의 생활화를 꾀하는 데 있다."], a:1, ex:"안전점검은 잠재 위험을 사전에 발견하여 재해를 예방하기 위해 필요하다." },
{ r:1, s:2, q:"건조에 따른 목재의 변형을 방지하고 넓은 판재를 얻을 수 있는 맞춤 방법은?", ch:["주먹장맞춤","쪽매맞춤","반턱맞춤","홈맞춤"], a:1, ex:"쪽매맞춤은 판재의 한 면을 평면 또는 촉으로, 다른 한 면은 홈을 만들어 서로 맞대어 건조에 따른 변형을 방지하고 넓은 판재를 얻을 수 있도록 하는 맞춤이다." },
{ r:1, s:2, q:"투명 래커의 끝맺음칠을 하는 가장 알맞은 도장 방법은?", ch:["붓칠","뿜칠","솜뭉치칠","정전도장법"], a:2, ex:"투명 래커의 끝맺음(광택 마무리)칠은 솜뭉치칠로 얇고 균일하게 문질러 마감하는 것이 가장 알맞다." },
{ r:1, s:2, q:"심한 곡면이나 작은 부재의 불규칙한 면을 깎는 대패는?", ch:["평대패","배대패","둥근대패","남경대패"], a:3, ex:"남경대패는 배대패로 깎을 수 없는 심한 곡면이나 작은 부재의 불규칙한 면을 깎는다." },
{ r:1, s:2, q:"띠톱기계 사용 시 지켜야 할 사항 중 잘못 설명한 것은?", ch:["작동 전 톱날의 이상 유무를 살핀다.","발은 어깨너비로 벌리며, 두 손으로 부재를 잡고 머리를 숙이지 않는다.","급한 곡선일수록 넓은 톱날을 사용한다.","잘려진 나무토막은 보조막대를 이용하여 치우도록 한다."], a:2, ex:"급한 곡선일수록 좁은 톱날을 사용해야 회전 반경을 따라갈 수 있다." },
{ r:1, s:2, q:"톱의 부분 명칭이 아닌 것은?", ch:["톱머리","목","허리","갱기"], a:1, ex:"톱의 구조: 톱머리, 허리, 갱기, 부리, 이음눈, 자루끝, 등대기 철물 등으로 이루어지며 '목'이라는 명칭은 쓰지 않는다." },
{ r:1, s:2, q:"부조의 조각 기법 중 두드러진 모양의 높이에 따라 구분하는 방법이 아닌 것은?", ch:["고부조","철부조","중부조","저부조"], a:1, ex:"두드러진 깊이와 형상의 높이에 따라 저부조, 중부조, 고부조의 3가지로 구분되며, '철부조'라는 구분은 없다." },
{ r:1, s:2, q:"조각도에 대한 설명 중 틀린 것은?", ch:["조각도는 예리하게 갈아서 사용한다.","조각도를 연마할 때는 숫돌 눈매를 고운 것에서 굵고 거친 순서로 연마한다.","조각도는 일반적으로 평칼, 둥근칼, 창칼, 삼각칼 등으로 나눈다.","조각도 날의 각은 20~25°로 단단한 나무일수록 각도가 커진다."], a:1, ex:"조각도를 연마할 때는 숫돌 눈매가 굵고 거친 것에서 고운 순서로 연마해야 하며, 반대로 설명한 것은 틀렸다." },
{ r:1, s:2, q:"다음 중 송곳의 종류에 대한 사용 용도로 틀린 것은?", ch:["세모송곳은 깊은 구멍을 뚫을 때 사용한다.","반달송곳은 둥근 모양의 나사 구멍을 뚫을 때 사용한다.","네모송곳은 단단한 나무, 대나무의 정확한 구멍을 뚫을 때 사용한다.","돌보송곳은 돌보에 의해 회전시켜 구멍을 뚫을 때 사용한다."], a:2, ex:"네모송곳은 네모난 구멍을 뚫을 때 사용하는 것으로, '단단한 나무·대나무의 정확한 구멍'이라는 설명은 틀렸다." },
{ r:1, s:2, q:"투조 작업에 많이 사용하는 기계는?", ch:["띠톱기계","각끌기계","실톱기계","조각기계"], a:2, ex:"실톱기계는 투조 또는 섬세한 문양을 오리거나 켜기, 자르기, 여러 모양을 뚫는 작업에 많이 사용한다." },
{ r:1, s:2, q:"목재의 이음과 맞춤에 관한 내용 중 옳지 않은 것은?", ch:["모양에 치중하지 않는 것이 좋다.","안전을 위해 될 수 있는 한 복잡한 이음으로 하는 것이 좋다.","접합부에 흠이 생기지 않도록 한다.","접합면의 이음, 맞춤은 정확히 밀착시킨다."], a:1, ex:"공작이 간단한 것을 사용하며 모양에 치중하지 않는 것이 원칙이므로, 복잡한 이음이 좋다는 설명은 틀렸다." },
{ r:1, s:2, q:"다음 중 원둘레 측정이 가능하도록 제작된 측정기구는?", ch:["조합자","버니어 캘리퍼스","곱자","접자"], a:2, ex:"곱자의 용도: 직각 검사, 원둘레 측정, 직선 및 근사곡선 그리기, 정사각형에서 정팔각형 그리기." },
{ r:1, s:2, q:"중복되는 부재를 마름질할 때 올바른 작업 방법은?", ch:["그무개로 하나씩 금긋기한다.","부재의 마구리면을 맞추고 죔쇠로 조인 후 금긋기한다.","조합자로 직각 금긋기를 한다.","직각자로 자유롭게 금긋기를 한다."], a:1, ex:"부재의 마구리면을 맞추고 죔쇠로 조인 후 금긋기하면 부재들이 정확하게 동일한 위치에서 절단될 수 있다." },
{ r:1, s:2, q:"평대패에서 대팻날을 끼우는 물매 또는 끊는날의 각도는 몇 도인가?", ch:["28°","38°","48°","58°"], a:1, ex:"평대패에서 대팻날을 끼우는 물매(끊는날의 각도)는 38°가 표준이다." },

{ r:2, s:0, q:"원의 반지름으로 원주를 끊고, 그 끊은 점과 점을 연결하여 만들어진 원에 접하는 다각형은?", ch:["정사각형","정오각형","정육각형","정팔각형"], a:2, ex:"원주를 원의 반지름으로 6등분하면 각 점을 연결하여 정육각형을 만들 수 있다." },
{ r:2, s:0, q:"유각 투시도는 소실점이 몇 개인가?", ch:["1개","2개","3개","4개"], a:1, ex:"유각 투시도는 화면에 물체와 수직인 면들이 일정한 각도를 유지하고 위아래 면이 수평인 투시도로, 소실점이 2개이다." },
{ r:2, s:0, q:"다음 그림에서 선 Ⓐ의 명칭으로 옳은 것은?", ch:["파단선","단면선","절단선","가상선"], a:0, ex:"파단선은 물체의 일부를 잘라내고 생략했음을 나타내는, 불규칙한 지그재그 모양의 가는 실선이다.", diagram:"r3q3" },
{ r:2, s:0, q:"명시도에 대한 설명 중 틀린 것은?", ch:["고유 특성에 의한 것보다 배경과 관계에 의해 결정된다.","검은색 배경에는 황색이나 주황색이 명시도가 높다.","명시도를 높이는 결정적인 조건은 채도이다.","황색이나 주황색 바탕에는 청색이나 자색이 명시도가 높다."], a:2, ex:"명시도를 높이는 결정적인 조건은 채도가 아니라 명도이다." },

{ r:2, s:0, q:"장축과 단축이 주어진 타원을 그릴 때의 작도 조건이 아닌 것은?", ch:["½ EF = G","FH = OF","AE = CO","OE = OF"], a:1, ex:"네 개의 원(트래멀법)을 이용한 타원 작도에서 성립하는 관계는 ½EF=G, AE=CO, OE=OF이며, FH=OF는 성립하지 않는다.", diagram:"r3q6" },
{ r:2, s:0, q:"삼각스케일에 대한 설명으로 틀린 것은?", ch:["임의의 축척으로 도면을 그릴 때 사용한다.","1/100, 1/200, 1/300, 1/400, 1/500, 1/600의 6가지 축척 눈금이 있다.","1/10, 1/20, 1/30 등의 도면을 작도할 때 사용한다.","길이를 재거나 길이를 줄여 그릴 때 사용한다."], a:0, ex:"삼각스케일은 1/100, 1/200, 1/300, 1/400, 1/500, 1/600의 6가지 정해진 축척 눈금만 있으며, 임의의 축척에는 사용할 수 없다." },
{ r:2, s:0, q:"다음 중 텍스처에 대한 표현에 해당하지 않는 것은?", ch:["차다.","따뜻하다.","부드럽다.","크다."], a:3, ex:"텍스처는 시각적·촉각적으로 느껴지는 물체 표면의 결이나 소재의 표면 효과를 말하므로 크기와는 관련이 없다." },
{ r:2, s:0, q:"색의 3속성에 대한 설명 중 옳은 것은?", ch:["사람의 눈은 색의 3속성 중 명도에 가장 예민하다.","어떤 색상의 순색에 무채색의 포함량이 많을수록 채도가 높아진다.","어떤 색이 다른 색과 구별되는 성질을 명도라 한다.","낮은 채도일수록 명도가 높다."], a:0, ex:"어떤 색상의 순색에 무채색의 포함량이 많을수록 채도는 오히려 낮아진다. 다른 색과 구별되는 성질은 명도가 아니라 색상(hue)이며, 낮은 채도가 반드시 높은 명도를 의미하지는 않는다." },
{ r:2, s:0, q:"조선 시대 공예품 중 가장 간결하고 소박하며 합리적인 것은?", ch:["목공예품","나전칠기","화청자","화각장"], a:0, ex:"목공예품은 장식을 절제하고 재료 본연의 질감을 살린, 가장 간결하고 소박하며 합리적인 조선 공예의 특징을 대표한다." },
{ r:2, s:0, q:"원과 같은 넓이의 정사각형을 작도할 때, 각각 어느 점을 중심으로 하여 AB를 반지름으로 호를 그리면 되는가?", ch:["A, B","C, D","E, F","B, D"], a:3, ex:"그림의 작도 순서에서는 B와 D를 중심으로 AB를 반지름으로 하는 호를 그려 정사각형의 나머지 꼭짓점(F, G)을 구한다.", diagram:"r3q11" },
{ r:2, s:0, q:"오스트발트 표색계에 따르면 기본적으로 몇 개의 주요 색상으로 나뉘는가?", ch:["4개","6개","8개","10개"], a:2, ex:"오스트발트 표색계는 색상환을 8개의 주요 색상으로 나누고, 8가지 기본 색을 다시 3가지 색으로 나누어 24색상환으로 완성한 것이다." },
{ r:2, s:0, q:"다음 그림과 같은 투상도는?", ch:["사투상도","1점 투시도","등각 투상도","부등각 투상도"], a:0, ex:"사투상도에서 정면은 정투상도의 정면도와 같은 크기로 그리며, 윗면과 옆면은 수평선과 30°, 45°, 60° 경사지게 그린다.", diagram:"r3q13" },
{ r:2, s:0, q:"공예 제도에 관한 설명 중 틀린 것은?", ch:["도면은 될 수 있는 대로 간단명료하게 그리는 것이 좋다.","외형은 굵은 실선으로 표시한다.","치수는 모두 cm 단위를 사용하는 것이 원칙이다.","치수는 반드시 실제 치수를 기입한다."], a:2, ex:"치수는 모두 mm 단위를 사용하는 것이 원칙이다." },
{ r:2, s:0, q:"괴목의 아름다운 목리를 잘 살리기 위해 되도록 복잡한 조각을 피하여 단순하고 매끄럽게 작품을 만들려고 한다면 어떤 점에 가장 유의해야 하는가?", ch:["공간감","양감","추상형","질감"], a:3, ex:"목재 고유의 무늬(목리)를 살리려면 표면의 결과 광택 등 질감을 가장 우선적으로 고려해야 한다." },
{ r:2, s:0, q:"두 가지 색으로 회전 혼합했을 때 무채색이 되었다면 두 색의 관계는?", ch:["유사색","보색","탁색","명색"], a:1, ex:"보색은 색상의 차가 가장 크고 서로 반대되는 색으로, 섞으면 무채색이 된다." },
{ r:2, s:0, q:"다음 중 현대 공예의 정의를 가장 잘 설명한 것은?", ch:["기능의 결함 없이 미적 질서를 갖는 실용 예술","장식적인 미를 위주로 하는 감상 예술","개인적인 기호나 취향을 표현한 시각 예술","정신적인 욕구 충족 표현의 감각 예술"], a:0, ex:"현대 공예는 실용성(기능)과 미적 질서를 함께 갖추는 것을 본질로 하는 실용 예술로 정의된다." },

{ r:2, s:1, q:"습기와 접촉되는 곳에서는 방습성이 좋은 나사못을 사용하는 것이 좋다. 다음 중 어느 못이 가장 적당한가?", ch:["강철 나사못","놋쇠 나사못","청동 나사못","연강 나사못"], a:1, ex:"황동(놋쇠)은 구리에 아연이 28~42% 혼합되어 이루어진 합금으로, 대기 중에서 내부식성이 있고 인장강도가 커서 장식품에 많이 사용된다." },
{ r:2, s:1, q:"소리가 목재에 닿으면 일부는 흡수되고 일부는 통과하며, 일부는 반사한다. 이러한 목재의 성질을 이용한 것은?", ch:["조각 재료","선박 재료","악기 재료","가구 재료"], a:2, ex:"목재의 흡음·공명 특성을 활용하여 음향에 유리한 목재를 악기 재료로 사용한다." },

{ r:2, s:1, q:"다음 중 목재의 바탕 조정법에 해당하지 않는 것은?", ch:["수지분 제거하기","갈라짐, 벌레 구멍, 틈 메우기","칼과 대패질 자국 삭제하기","부러진 부분 붙이기"], a:3, ex:"바탕 조정법은 수지분 제거, 갈라짐·벌레 구멍·틈 메우기, 칼·대패질 자국 삭제 등을 포함하며, 부러진 부분을 붙이는 것은 별도의 보수 작업이다." },

{ r:2, s:1, q:"목재를 잡아끄는 외력에 대한 저항으로, 섬유 방향이 목재의 강도 중 가장 크며 직각 방향이 가장 작은 강도는?", ch:["휨강도","인장강도","전단강도","압축강도"], a:1, ex:"인장강도는 섬유(결) 방향으로 가장 크게 나타나며 섬유에 직각인 방향으로는 매우 작다." },
{ r:2, s:1, q:"목재, 합판 등의 접착제로 내수성과 내열성이 큰 합성수지계 접착제는?", ch:["폴리에스테르수지","아크릴계 수지","멜라민수지","요소수지"], a:2, ex:"멜라민수지 접착제는 내수성, 내약품성, 내열성이 우수하며 착색이 자유롭다." },

{ r:2, s:1, q:"다음 중 목재의 인장강도에 대한 설명 중 옳은 것은?", ch:["섬유결 방향이 일정하고 모든 방향에서 인장강도가 같다.","섬유결 방향이 가장 크고 직각 방향이 가장 작다.","섬유결 방향이나 직각 방향이 똑같다.","목재에 따라 섬유결 방향이 클 수도 있고 작을 수도 있다."], a:1, ex:"목재의 인장강도는 섬유결 방향으로 가장 크고, 섬유에 직각인 방향으로는 가장 작다." },
{ r:2, s:1, q:"활엽수에만 육안으로 잘 보이며, 목재의 결에 점으로 나타나는 조직은?", ch:["가도관","수선","수지구","물관"], a:1, ex:"수선은 양분을 저장·분배하고 수액을 수평 이동하는 통로 역할을 한다. 침엽수에서는 가늘어서 보이지 않지만 활엽수에서는 은색이나 어두운 얼룩무늬, 광택이 있는 아름다운 무늬로 나타난다." },

{ r:2, s:1, q:"심재에 대한 설명으로 틀린 것은?", ch:["목질이 단단하다.","기름기가 있다.","건조해도 변화가 적다.","색채 광택이 변재에 비해 적다."], a:3, ex:"심재는 변재에 비해 색채와 광택이 오히려 뚜렷하고 풍부하다." },
{ r:2, s:1, q:"다음 중 목재를 건조시키는 목적과 거리가 먼 것은?", ch:["각 부재의 수축이나 변형을 방지한다.","아름다운 무늬목을 얻기 위함이다.","부식을 방지하고 내구성을 높인다.","중량 감소로 가공, 취급, 운반이 용이하다."], a:1, ex:"목재 건조의 목적은 수축·변형 방지, 부식 방지와 내구성 향상, 중량 감소를 통한 가공·취급·운반의 편의성 확보에 있으며, 무늬목을 얻는 것과는 관계가 없다." },
{ r:2, s:1, q:"다음 중 캐슈(cashew) 눈메움제로 알맞지 않은 것은?", ch:["토분","차분","호분","카세인"], a:1, ex:"토분은 거친 쌀을 찧어 깨끗이 할 때 섞는 희고 고운 흙, 호분은 얼굴을 단장할 때 바르는 흰 가루, 카세인은 동물의 유즙 속에 있는 인을 함유한 단백질로 모두 눈메움제로 쓰이지만, 차분은 해당하지 않는다." },
{ r:2, s:1, q:"페인트칠을 하려고 할 때 목재의 바탕 조정은 어떻게 하는 것이 좋은가?", ch:["목재의 건조상태는 고려하지 않아도 좋다.","기름류, 오물은 물로 닦아낸다.","거칠게 일어난 결은 사포로 고르게 한다.","틈이 난 구멍은 접착제로 메운다."], a:2, ex:"거칠게 일어난 결은 사포로 문질러 매끄럽게 고르는 것이 올바른 바탕 조정 방법이다." },
{ r:2, s:1, q:"목재의 수축과 팽창에 관한 설명 중 맞는 것은?", ch:["활엽수보다 침엽수가 크다.","변재보다 심재가 크다.","섬유 방향이 가장 작고 무늿결 방향이 가장 크다.","비중이 큰 재보다 작은 재가 수축량이 크다."], a:2, ex:"목재의 수축·팽창은 섬유(길이) 방향이 가장 작고, 널결(무늿결) 방향이 가장 크며, 곧은결(방사) 방향은 그 중간이다." },
{ r:2, s:1, q:"다음 중 목재의 수축에 영향을 주는 요소가 아닌 것은?", ch:["목재의 비중","목리(결) 방향","목재의 색","목재의 응력"], a:2, ex:"목재의 색은 수축에 영향을 주는 요소가 아니다." },
{ r:2, s:1, q:"알코올을 용제로 사용하기 때문에 작업 중 화기에 주의해야 할 접착제는?", ch:["아교","카세인","전분","천연수지"], a:3, ex:"셸락 등 천연수지 접착제는 알코올을 용제로 사용하므로 인화성이 있어 작업 중 화기에 주의해야 한다." },

{ r:2, s:2, q:"그무개의 용도에 대한 설명으로 옳지 않은 것은?", ch:["평행선 긋기","얇은 판재 절단","끌 구멍 표시","주먹장 선긋기"], a:1, ex:"그무개는 금긋기 도구로 평행선 긋기, 끌 구멍 표시, 주먹장 선긋기 등에 사용되며, 판재를 직접 절단하는 용도는 아니다." },

      `<rect x="4" y="4" width="112" height="56"/><path d="M40 4 L52 30 L64 4" fill="none"/><path d="M40 4 L28 30 L64 30 L52 4" fill="none" opacity="0"/><path d="M52 4 L40 30 L64 30 L52 4Z" opacity="0"/>` ,
    ];
    // simpler explicit paths per option (outer rect = block, notch cut at top)
    const opt1 = `<rect x="4" y="4" width="112" height="56"/><path d="M40 4 L52 30 L64 4" fill="var(--surface)"/>`; // narrow top wide bottom (undercut) - drawn via reversed trapezoid below
    const shapes = [
      `<rect x="4" y="4" width="112" height="56" fill="none"/><path d="M38 4 L30 30 L86 30 L78 4" fill="var(--bg)"/>`, // ① wide bottom narrow top (undercut, wrong)
      `<rect x="4" y="4" width="112" height="56" fill="none"/><path d="M30 4 L38 30 L78 30 L86 4" fill="var(--bg)"/>`, // ② narrow bottom wide top (correct taper)
      `<rect x="4" y="4" width="112" height="56" fill="none"/><path d="M30 4 L30 20 A28 10 0 0 0 86 20 L86 4" fill="var(--bg)"/>`, // ③ round bottom
      `<rect x="4" y="4" width="112" height="56" fill="none"/><path d="M30 4 L30 30 L86 30 L70 4" fill="var(--bg)"/>` // ④ asymmetric
    ];
    return wrapFigs(shapes.map((svg,i)=>({svg, w:120, h:64, sw:2.4, cap:['①','②','③','④'][i]})));
  }
  if(kind === "r3q54"){
    const shapes = [
      `<rect x="4" y="10" width="52" height="44" fill="none"/><rect x="56" y="10" width="52" height="44" fill="none"/><line x1="56" y1="10" x2="56" y2="54" stroke-width="2.4"/>`, // 맞댄
      `<rect x="4" y="10" width="52" height="44" fill="none"/><rect x="56" y="10" width="52" height="44" fill="none"/><line x1="44" y1="10" x2="68" y2="54" stroke-width="2.4"/>`, // 빗
      `<path d="M4 10 H48 V24 H64 V10 H108 V54 H64 V40 H48 V54 H4 Z" fill="none"/>`, // 제혀 (일체형 촉)
      `<path d="M4 10 H46 V26 H50 V10 H108 V54 H50 V38 H46 V54 H4 Z" fill="none"/><rect x="46" y="26" width="4" height="12" fill="none" stroke-dasharray="2 2" stroke-width="1.6"/>` // 딴혀 (별도 스플라인)
    ];
    return wrapFigs(shapes.map((svg,i)=>({svg, w:112, h:60, sw:2.4, cap:['①','②','③','④'][i]})));
  }
  return "";
}

// ---- state ----
const state = DATA.map(()=>({ picked: null, graded: false, peeked: false }));

const sectionsEl = document.getElementById('sections');
const navPills = document.getElementById('navPills');
const answeredStat = document.getElementById('answeredStat');
const progressFill = document.getElementById('progressFill');
const summaryEl = document.getElementById('summary');
const scoreText = document.getElementById('scoreText');
const scoreBadge = document.getElementById('scoreBadge');
const scoreBreakdown = document.getElementById('scoreBreakdown');

const TOTAL = DATA.length;

function circled(i){ return ['①','②','③','④'][i]; }

function buildNav(){
  ROUNDS.forEach((rnd, ri) => {
    const p = document.createElement('button');
    p.className = 'pill round';
    p.textContent = rnd.name;
    p.onclick = () => document.getElementById('round-'+ri).scrollIntoView({behavior:'smooth', block:'start'});
    navPills.appendChild(p);
  });
}

function render(){
  sectionsEl.innerHTML = '';

  // group indices by round, then by section within round
  const byRound = ROUNDS.map(()=>[]);
  DATA.forEach((d,i)=>byRound[d.r].push(i));

  ROUNDS.forEach((rnd, ri) => {
    const idxs = byRound[ri];
    const roundHead = document.createElement('div');
    roundHead.className = 'round-head';
    roundHead.id = 'round-'+ri;
    const jump = rnd.sections.map((s,si)=>`<a href="#sec-${ri}-${si}">${si+1}과목 ${s}</a>`).join('');
    roundHead.innerHTML = `<div class="eyebrow">CBT 대비 실전문제</div><h1 class="round-title">${rnd.name} 모의고사</h1><p class="round-sub">문항 ${idxs.length}개</p><div class="round-jump">${jump}</div>`;
    sectionsEl.appendChild(roundHead);

    const bySec = rnd.sections.map(()=>[]);
    idxs.forEach(i=>bySec[DATA[i].s].push(i));

    rnd.sections.forEach((secName, si) => {
      const secIdxs = bySec[si];
      if(secIdxs.length===0) return;
      const head = document.createElement('div');
      head.className = 'section-head';
      head.id = 'sec-'+ri+'-'+si;
      head.innerHTML = `<span class="num">${si+1}과목</span><h2>${secName}</h2><span class="range">${secIdxs.length}문항</span>`;
      sectionsEl.appendChild(head);

      secIdxs.forEach((i, localIdx) => {
        const d = DATA[i];
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = 'card-'+i;

        const head2 = document.createElement('div');
        head2.className = 'q-head';
        head2.innerHTML = `<div class="q-no">${localIdx+1}</div><div class="q-text">${d.q}</div>`;
        card.appendChild(head2);

        if(d.diagram){
          const dg = document.createElement('div');
          dg.innerHTML = diagramSVG(d.diagram);
          card.appendChild(dg.firstChild);
        }

        const choicesEl = document.createElement('div');
        choicesEl.className = 'choices';
        d.ch.forEach((c, ci) => {
          const b = document.createElement('button');
          b.className = 'choice';
          b.innerHTML = `<span class="mark">${circled(ci)}</span><span>${c}</span>`;
          b.onclick = () => pick(i, ci);
          choicesEl.appendChild(b);
        });
        card.appendChild(choicesEl);

        const foot = document.createElement('div');
        foot.className = 'q-foot';
        const link = document.createElement('button');
        link.className = 'reveal-link';
        link.textContent = '정답 · 해설 보기';
        link.onclick = () => togglePeek(i);
        foot.appendChild(link);
        const flag = document.createElement('span');
        flag.className = 'result-flag';
        flag.id = 'flag-'+i;
        foot.appendChild(flag);
        card.appendChild(foot);

        const explain = document.createElement('div');
        explain.className = 'explain';
        explain.id = 'explain-'+i;
        explain.innerHTML = `<div class="ans-line">정답 <span class="num">${circled(d.a)}</span> ${d.ch[d.a]}</div><div>${d.ex}</div>`;
        card.appendChild(explain);

        sectionsEl.appendChild(card);
      });
    });
  });
}

function pick(i, ci){
  if(state[i].graded) return;
  state[i].picked = ci;
  updateCard(i);
  updateStats();
}

function togglePeek(i){
  state[i].peeked = !state[i].peeked;
  updateCard(i);
}

function updateCard(i){
  const d = DATA[i];
  const st = state[i];
  const card = document.getElementById('card-'+i);
  const buttons = card.querySelectorAll('.choice');
  const explain = document.getElementById('explain-'+i);
  const flag = document.getElementById('flag-'+i);
  const link = card.querySelector('.reveal-link');

  buttons.forEach((b, ci) => {
    b.classList.remove('selected','is-correct','is-wrong','locked');
    const tag = b.querySelector('.tag'); if(tag) tag.remove();
    if(st.picked === ci) b.classList.add('selected');

    if(st.graded){
      b.classList.add('locked');
      if(ci === d.a){
        b.classList.add('is-correct');
        const t = document.createElement('span'); t.className='tag'; t.textContent='정답'; b.appendChild(t);
      } else if(ci === st.picked){
        b.classList.add('is-wrong');
        const t = document.createElement('span'); t.className='tag'; t.textContent='선택'; b.appendChild(t);
      }
    }
  });

  const showExplain = st.graded || st.peeked;
  explain.classList.toggle('show', showExplain);
  link.textContent = st.peeked ? '해설 접기' : '정답 · 해설 보기';

  if(st.graded){
    if(st.picked === d.a){ flag.textContent = '정답'; flag.className = 'result-flag ok'; }
    else if(st.picked === null){ flag.textContent = '미응답'; flag.className = 'result-flag no'; }
    else { flag.textContent = '오답'; flag.className = 'result-flag no'; }
  } else {
    flag.textContent = '';
  }
}

function updateStats(){
  const answered = state.filter(s=>s.picked !== null).length;
  answeredStat.innerHTML = `<b>${answered}</b>/${TOTAL} 응답`;
  progressFill.style.width = (answered/TOTAL*100)+'%';
}

function grade(){
  state.forEach((s,i)=>{ s.graded = true; updateCard(i); });
  const correct = state.filter((s,i)=>s.picked === DATA[i].a).length;
  scoreText.innerHTML = `${correct}<span>/${TOTAL}</span>`;
  const pct = Math.round(correct/TOTAL*100);
  const pass = pct >= 60;
  scoreBadge.innerHTML = `<span class="badge ${pass?'pass':'fail'}">${pct}점 · ${pass?'합격 예상':'재학습 필요'}</span>`;

  scoreBreakdown.innerHTML = ROUNDS.map((rnd,ri)=>{
    const idxs = DATA.map((d,i)=>i).filter(i=>DATA[i].r===ri);
    const c = idxs.filter(i=>state[i].picked===DATA[i].a).length;
    return `<div><div class="bnum">${c}/${idxs.length}</div><div class="blabel">${rnd.name}</div></div>`;
  }).join('');

  summaryEl.classList.add('show');
  summaryEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function reset(){
  state.forEach(s=>{ s.picked=null; s.graded=false; s.peeked=false; });
  DATA.forEach((_,i)=>updateCard(i));
  updateStats();
  summaryEl.classList.remove('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('gradeBtn').onclick = grade;
document.getElementById('resetBtn').onclick = reset;

buildNav();
render();
updateStats();
</script>
