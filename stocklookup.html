<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 시세 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1f2d47;
    --accent: #00d4aa;
    --accent2: #4f8ef7;
    --red: #ff4f6b;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 48px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,212,170,0.1);
    border: 1px solid rgba(0,212,170,0.3);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 500;
  }

  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1.15;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    color: var(--text-muted);
    margin-top: 10px;
    font-size: 14px;
    font-weight: 300;
  }

  /* Search box */
  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
  }

  .search-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: block;
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  .search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--text);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 1px;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,170,0.1);
  }

  .search-input::placeholder {
    color: var(--text-muted);
    font-family: 'Noto Sans KR', sans-serif;
    letter-spacing: 0;
  }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .btn:hover {
    background: #00f0c0;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0,212,170,0.3);
  }

  .btn:active { transform: translateY(0); }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .hint span {
    color: var(--accent);
    cursor: pointer;
    font-weight: 500;
  }

  .hint span:hover { text-decoration: underline; }

  /* Date range row */
  .date-range-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    align-items: center;
  }

  .date-range-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .date-sep {
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 2px;
  }

  .date-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
    cursor: pointer;
    flex: 1;
    min-width: 140px;
  }

  .date-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,170,0.1);
  }

  .date-input::-webkit-calendar-picker-indicator {
    filter: invert(0.5) sepia(1) saturate(3) hue-rotate(120deg);
    cursor: pointer;
  }

  /* Options row */
  .options-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  /* Button row at bottom */
  .btn-row {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-row .btn {
    width: 100%;
  }

  .select-wrap {
    position: relative;
    flex: 1;
    min-width: 140px;
  }

  .select-wrap select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 36px 12px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    cursor: pointer;
    appearance: none;
    transition: border-color 0.2s;
  }

  .select-wrap select:focus {
    border-color: var(--accent);
  }

  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    font-size: 12px;
  }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .loading.show { display: block; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error-box {
    display: none;
    background: rgba(255,79,107,0.08);
    border: 1px solid rgba(255,79,107,0.3);
    border-radius: 12px;
    padding: 18px 22px;
    color: #ff8fa0;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .error-box.show { display: flex; align-items: center; gap: 10px; }

  /* Result card */
  .result-card {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: slideUp 0.3s ease;
    margin-bottom: 24px;
  }

  .result-card.show { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .stock-name {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .stock-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .stock-market {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(79,142,247,0.1);
    border: 1px solid rgba(79,142,247,0.25);
    color: var(--accent2);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  /* Price */
  .price-section {
    padding: 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }

  .price-current {
    font-size: 44px;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -2px;
    line-height: 1;
  }

  .price-current.up { color: #ff4f6b; }
  .price-current.down { color: var(--accent2); }

  .price-change {
    font-size: 16px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    padding: 6px 12px;
    border-radius: 8px;
  }

  .price-change.up {
    background: rgba(255,79,107,0.1);
    color: #ff4f6b;
    border: 1px solid rgba(255,79,107,0.2);
  }

  .price-change.down {
    background: rgba(79,142,247,0.1);
    color: var(--accent2);
    border: 1px solid rgba(79,142,247,0.2);
  }

  .price-change.flat {
    background: rgba(100,116,139,0.1);
    color: var(--text-muted);
    border: 1px solid rgba(100,116,139,0.2);
  }

  .price-date {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Grid stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 0;
  }

  .stat-item {
    padding: 18px 24px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-item:nth-child(4n) { border-right: none; }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -0.5px;
  }

  .stat-value.up { color: #ff4f6b; }
  .stat-value.down { color: var(--accent2); }

  /* Table results */
  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  tr:last-child td { border-bottom: none; }

  tr:hover td { background: rgba(255,255,255,0.02); }

  .td-name {
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0;
  }

  .td-up { color: #ff4f6b; }
  .td-down { color: var(--accent2); }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    border-top: 1px solid var(--border);
  }

  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'JetBrains Mono', monospace;
  }

  .page-btn:hover, .page-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Info strip */
  .info-strip {
    font-size: 12px;
    color: var(--text-muted);
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .info-strip strong { color: var(--accent); }

  @media (max-width: 600px) {
    .search-row { flex-direction: column; }
    .card-header { flex-direction: column; gap: 10px; }
    .price-date { margin-left: 0; }
    .stat-item:nth-child(4n) { border-right: 1px solid var(--border); }
    .stat-item:nth-child(2n) { border-right: none; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="badge">금융위원회 Open API</div>
    <h1>주식 시세 <span>조회</span></h1>
    <p class="subtitle">금융위원회 주식시세정보 API — 실시간 주식 데이터 조회 시스템</p>
  </header>

  <div class="search-section">
    <label class="search-label">종목 검색</label>
    <div class="search-row">
      <input class="search-input" id="searchInput" type="text"
        placeholder="종목명 또는 종목코드 입력 (예: 삼성전자, 005930)"
        autocomplete="off" />
    </div>
    <div class="hint">
      빠른 검색:
      <span onclick="quickSearch('삼성전자')">삼성전자</span> ·
      <span onclick="quickSearch('SK하이닉스')">SK하이닉스</span> ·
      <span onclick="quickSearch('NAVER')">NAVER</span> ·
      <span onclick="quickSearch('카카오')">카카오</span> ·
      <span onclick="quickSearch('현대차')">현대차</span>
    </div>

    <div class="date-range-row">
      <span class="date-range-label">조회 기간</span>
      <input class="date-input" type="date" id="startDate" />
      <span class="date-sep">~</span>
      <input class="date-input" type="date" id="endDate" />
    </div>

    <div class="options-row">
      <div class="select-wrap">
        <select id="marketType">
          <option value="">전체 시장</option>
          <option value="KOSPI">KOSPI</option>
          <option value="KOSDAQ">KOSDAQ</option>
          <option value="KONEX">KONEX</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="numRows">
          <option value="10">10건</option>
          <option value="20" selected>20건</option>
          <option value="50">50건</option>
          <option value="100">100건</option>
        </select>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="searchBtn" onclick="search()">조회</button>
    </div>
  </div>

  <div class="error-box" id="errorBox">
    <span>⚠</span>
    <span id="errorMsg"></span>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>데이터를 불러오는 중...</div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="card-header" id="cardHeader"></div>
    <div class="price-section" id="priceSection"></div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="result-card" id="tableCard">
    <div class="table-wrap">
      <table id="resultTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="info-strip" id="infoStrip"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script>
const API_KEY = 'dc8294cd0177c5d51b45be29652fb691c4b18e055f22c87b0967ca1a78c7df0a';
const BASE_URL = 'https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo';

let currentPage = 1;
let totalCount = 0;
let lastQuery = {};

function quickSearch(name) {
  document.getElementById('searchInput').value = name;
  search();
}

function formatNum(v) {
  if (!v || v === '-') return '-';
  const n = Number(v);
  if (isNaN(n)) return v;
  return n.toLocaleString('ko-KR');
}

function formatChange(v) {
  if (!v || v === '0' || v === '') return 'flat';
  return Number(v) > 0 ? 'up' : 'down';
}

function arrow(v) {
  if (!v || v === '0') return '';
  return Number(v) > 0 ? '▲' : '▼';
}

async function fetchData(params) {
  const qs = new URLSearchParams({
    serviceKey: API_KEY,
    resultType: 'json',
    ...params
  });
  const url = `${BASE_URL}?${qs}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  return data;
}

async function search(page = 1) {
  const query = document.getElementById('searchInput').value.trim();
  const market = document.getElementById('marketType').value;
  const numOfRows = document.getElementById('numRows').value;
  const startDate = document.getElementById('startDate').value.replace(/-/g, '');
  const endDate = document.getElementById('endDate').value.replace(/-/g, '');

  hideAll();

  const params = { numOfRows, pageNo: page };

  // 종목코드 패턴 (6자리 숫자)
  if (/^\d{6}$/.test(query)) {
    params.likeSrtnCd = query;
  } else if (query) {
    params.likeItmsNm = query;
  }

  if (market) params.mrktCls = market;
  if (startDate) params.beginBasDt = startDate;
  if (endDate) params.endBasDt = endDate;

  if (!query && !market) {
    showError('종목명, 종목코드 또는 시장을 입력해주세요.');
    return;
  }

  lastQuery = { query, market, numOfRows, startDate, endDate };
  currentPage = page;

  showLoading(true);
  document.getElementById('searchBtn').disabled = true;

  try {
    const data = await fetchData(params);
    const body = data?.response?.body;

    if (!body) throw new Error('응답 데이터 오류');

    const items = body.items?.item;
    totalCount = parseInt(body.totalCount || 0);

    if (!items || totalCount === 0) {
      showError('검색 결과가 없습니다. 종목명이나 코드를 확인해주세요.');
      return;
    }

    const list = Array.isArray(items) ? items : [items];

    // 단일 결과: 상세 카드
    if (list.length === 1) {
      renderDetailCard(list[0]);
    } else {
      renderTable(list, parseInt(numOfRows), page);
    }

  } catch (e) {
    console.error(e);
    showError('API 호출 중 오류가 발생했습니다. CORS 환경에서는 직접 조회가 제한될 수 있습니다.\n(' + e.message + ')');
  } finally {
    showLoading(false);
    document.getElementById('searchBtn').disabled = false;
  }
}

function renderDetailCard(item) {
  const dir = formatChange(item.vs);

  // Header
  document.getElementById('cardHeader').innerHTML = `
    <div>
      <div class="stock-name">${item.itmsNm || '-'}</div>
      <div class="stock-code">${item.srtnCd || ''} &nbsp;|&nbsp; ${item.isinCd || ''}</div>
    </div>
    <div class="stock-market">${item.mrktCtg || '-'}</div>
  `;

  // Price
  const sign = dir === 'up' ? '+' : dir === 'down' ? '-' : '';
  document.getElementById('priceSection').innerHTML = `
    <div class="price-current ${dir}">${formatNum(item.clpr)}원</div>
    <div class="price-change ${dir}">
      ${arrow(item.vs)} ${formatNum(Math.abs(item.vs))} (${sign}${item.fltRt || '0'}%)
    </div>
    <div class="price-date">${formatDate(item.basDt)}</div>
  `;

  // Stats grid
  const stats = [
    { label: '시가', value: formatNum(item.mkp), cls: '' },
    { label: '고가', value: formatNum(item.hipr), cls: 'up' },
    { label: '저가', value: formatNum(item.lopr), cls: 'down' },
    { label: '전일종가', value: formatNum(item.vs ? item.clpr - item.vs : '-'), cls: '' },
    { label: '거래량', value: formatNum(item.trqu), cls: '' },
    { label: '거래대금', value: formatNum(item.trPrc) + (item.trPrc ? '원' : ''), cls: '' },
    { label: '시가총액', value: formatNum(item.mrktTotAmt) + (item.mrktTotAmt ? '원' : ''), cls: '' },
    { label: '상장주식수', value: formatNum(item.lstgStCnt), cls: '' },
  ];

  document.getElementById('statsGrid').innerHTML = stats.map((s, i) => `
    <div class="stat-item">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value ${s.cls}">${s.value}</div>
    </div>
  `).join('');

  document.getElementById('resultCard').classList.add('show');
}

function renderTable(list, numOfRows, page) {
  document.getElementById('tableHead').innerHTML = `
    <tr>
      <th>기준일</th>
      <th>종목명</th>
      <th>종목코드</th>
      <th>시장</th>
      <th>종가</th>
      <th>등락</th>
      <th>등락률</th>
      <th>시가</th>
      <th>고가</th>
      <th>저가</th>
      <th>거래량</th>
    </tr>
  `;

  document.getElementById('tableBody').innerHTML = list.map(item => {
    const dir = formatChange(item.vs);
    const sign = dir === 'up' ? '+' : '';
    return `
      <tr onclick="selectStock('${item.itmsNm}')" style="cursor:pointer">
        <td>${formatDate(item.basDt)}</td>
        <td class="td-name">${item.itmsNm || '-'}</td>
        <td>${item.srtnCd || '-'}</td>
        <td>${item.mrktCtg || '-'}</td>
        <td>${formatNum(item.clpr)}</td>
        <td class="td-${dir}">${arrow(item.vs)} ${formatNum(Math.abs(item.vs))}</td>
        <td class="td-${dir}">${sign}${item.fltRt || '0'}%</td>
        <td>${formatNum(item.mkp)}</td>
        <td class="td-up">${formatNum(item.hipr)}</td>
        <td class="td-down">${formatNum(item.lopr)}</td>
        <td>${formatNum(item.trqu)}</td>
      </tr>
    `;
  }).join('');

  const totalPages = Math.ceil(totalCount / numOfRows);
  document.getElementById('infoStrip').innerHTML = `
    총 <strong>${totalCount.toLocaleString()}</strong>건 · 
    ${page}/${totalPages} 페이지 · 
    <span style="color:var(--text-muted)">행 클릭 시 상세 조회</span>
  `;

  // Pagination
  let paginHtml = '';
  paginHtml += `<button class="page-btn" onclick="search(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹</button>`;
  const startPage = Math.max(1, page - 2);
  const endPage = Math.min(totalPages, startPage + 4);
  for (let i = startPage; i <= endPage; i++) {
    paginHtml += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="search(${i})">${i}</button>`;
  }
  paginHtml += `<button class="page-btn" onclick="search(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>›</button>`;
  document.getElementById('pagination').innerHTML = paginHtml;

  document.getElementById('tableCard').classList.add('show');
}

function selectStock(name) {
  document.getElementById('searchInput').value = name;
  search();
}

function formatDate(d) {
  if (!d || d.length !== 8) return d || '-';
  return `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}

function showLoading(v) {
  document.getElementById('loading').classList.toggle('show', v);
}

function hideAll() {
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('tableCard').classList.remove('show');
  document.getElementById('loading').classList.remove('show');
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

// 기본 조회기간: 최근 1개월
(function initDates() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const endStr = `${yyyy}-${mm}-${dd}`;

  const monthAgo = new Date(today);
  monthAgo.setMonth(monthAgo.getMonth() - 1);
  const sy = monthAgo.getFullYear();
  const sm = String(monthAgo.getMonth() + 1).padStart(2, '0');
  const sd = String(monthAgo.getDate()).padStart(2, '0');
  const startStr = `${sy}-${sm}-${sd}`;

  document.getElementById('startDate').value = startStr;
  document.getElementById('endDate').value = endStr;
})();
</script>
