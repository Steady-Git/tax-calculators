<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생필품 가격 정보 — 한국소비자원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1e28;
    --border: #252a38;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --accent3: #f59e0b;
    --text: #e8eaf0;
    --muted: #6b7280;
    --danger: #f87171;
    --card-glow: rgba(74, 222, 128, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,12,16,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
  }

  .badge {
    background: rgba(74,222,128,0.12);
    border: 1px solid rgba(74,222,128,0.3);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
  }

  /* Main layout */
  main {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* Hero */
  .hero {
    text-align: center;
    padding: 3rem 0 2rem;
    animation: fadeUp 0.6s ease both;
  }

  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.2);
    color: var(--accent);
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 1.2rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
  }

  .hero-label::before {
    content: '●';
    font-size: 8px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .hero h1 span {
    color: var(--accent);
  }

  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* Search section */
  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin: 2rem 0;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .search-section h2 {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 1rem;
    font-family: 'DM Mono', monospace;
  }

  .search-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .field input, .field select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .field input::placeholder { color: var(--muted); }

  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,222,128,0.1);
  }

  .field select option { background: var(--surface); }

  .btn-search {
    background: var(--accent);
    color: #0a0c10;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.2s;
    height: 42px;
  }

  .btn-search:hover {
    background: #22c55e;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(74,222,128,0.3);
  }

  .btn-search:active { transform: translateY(0); }

  .btn-search:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    width: fit-content;
  }

  .tab {
    padding: 7px 18px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .tab.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    font-size: 13px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .result-count {
    color: var(--accent);
    font-weight: 500;
  }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  td {
    padding: 13px 16px;
    border-bottom: 1px solid rgba(37,42,56,0.5);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }

  tbody tr {
    transition: background 0.15s;
  }

  tbody tr:hover { background: var(--card-glow); }

  .price-cell {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    color: var(--accent);
    font-size: 14px;
  }

  .product-name {
    font-weight: 500;
    color: var(--text);
    max-width: 180px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .store-name {
    color: var(--muted);
    font-size: 12px;
  }

  .sale-badge {
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.3);
    color: var(--accent3);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
  }

  /* Stats cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.4s ease both;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
  }

  .stat-card.green::before { background: var(--accent); }
  .stat-card.cyan::before { background: var(--accent2); }
  .stat-card.amber::before { background: var(--accent3); }
  .stat-card.red::before { background: var(--danger); }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -1px;
    font-family: 'DM Mono', monospace;
  }

  .stat-card.green .stat-value { color: var(--accent); }
  .stat-card.cyan .stat-value { color: var(--accent2); }
  .stat-card.amber .stat-value { color: var(--accent3); }
  .stat-card.red .stat-value { color: var(--danger); }

  .stat-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Chart section */
  .chart-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-top: 1.5rem;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 1.2rem;
    font-family: 'DM Mono', monospace;
  }

  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bar-label {
    font-size: 12px;
    color: var(--muted);
    width: 140px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-track {
    flex: 1;
    background: var(--bg);
    border-radius: 4px;
    height: 28px;
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, rgba(74,222,128,0.8), rgba(74,222,128,0.4));
    transition: width 0.8s cubic-bezier(0.23,1,0.32,1);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
  }

  .bar-fill.low { background: linear-gradient(90deg, rgba(74,222,128,0.8), rgba(74,222,128,0.4)); }
  .bar-fill.mid { background: linear-gradient(90deg, rgba(245,158,11,0.8), rgba(245,158,11,0.4)); }
  .bar-fill.high { background: linear-gradient(90deg, rgba(248,113,113,0.8), rgba(248,113,113,0.4)); }

  .bar-price {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #0a0c10;
  }

  /* Loading */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem;
    gap: 1rem;
    color: var(--muted);
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 4rem;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.4;
  }

  .empty h3 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
  .empty p { font-size: 13px; line-height: 1.6; }

  /* Error */
  .error-box {
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    color: var(--danger);
    font-size: 13px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 1rem;
  }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 1.5rem;
  }

  .page-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 34px;
    height: 34px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .page-btn:hover, .page-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(74,222,128,0.08);
  }

  .page-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .search-grid { grid-template-columns: 1fr 1fr; }
    .btn-search { width: 100%; justify-content: center; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5) { display: none; }
  }

  @media (max-width: 480px) {
    main { padding: 1rem; }
    .search-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }

  /* Tooltip */
  [data-tip] {
    position: relative;
    cursor: help;
  }

  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🛒</div>
      <div>
        <div class="logo-text">PriceInfo</div>
        <div class="logo-sub">한국소비자원 생필품 가격정보</div>
      </div>
    </div>
    <span class="badge">LIVE · OpenAPI</span>
  </div>
</header>

<main>
  <div class="hero">
    <div class="hero-label">실시간 생필품 가격 데이터</div>
    <h1>생필품 가격 <span>조회 & 분석</span></h1>
    <p>한국소비자원 참가격 포털의 실시간 데이터로<br>생필품 가격을 비교하고 최저가를 찾으세요.</p>
  </div>

  <!-- Search -->
  <div class="search-section">
    <h2>// 검색 조건</h2>
    <div class="search-grid">
      <div class="field">
        <label>상품명</label>
        <input type="text" id="productName" placeholder="예: 라면, 우유, 쌀..." value="">
      </div>
      <div class="field">
        <label>지역</label>
        <select id="area">
          <option value="">전국</option>
          <option value="서울">서울</option>
          <option value="부산">부산</option>
          <option value="대구">대구</option>
          <option value="인천">인천</option>
          <option value="광주">광주</option>
          <option value="대전">대전</option>
          <option value="울산">울산</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="충북">충북</option>
          <option value="충남">충남</option>
          <option value="전북">전북</option>
          <option value="전남">전남</option>
          <option value="경북">경북</option>
          <option value="경남">경남</option>
          <option value="제주">제주</option>
        </select>
      </div>
      <div class="field">
        <label>조회 건수</label>
        <select id="numOfRows">
          <option value="20">20건</option>
          <option value="50" selected>50건</option>
          <option value="100">100건</option>
        </select>
      </div>
      <button class="btn-search" id="searchBtn" onclick="search()">
        <span>🔍</span> 조회
      </button>

  <!-- Content area -->
  <div id="contentArea">
    <div class="empty">
      <div class="empty-icon">📦</div>
      <h3>검색어를 입력하세요</h3>
      <p>상품명을 입력하고 조회 버튼을 누르면<br>전국 생필품 가격 정보를 확인할 수 있습니다.</p>
    </div>
  </div>
</main>

<script>
const API_KEY = 'dc8294cd0177c5d51b45be29652fb691c4b18e055f22c87b0967ca1a78c7df0a';
const BASE_URL = 'https://openapi.price.go.kr/openApiImpl/ProductPriceInfoService/getProductInfo';

let currentData = [];
let currentPage = 1;
const itemsPerPage = 20;

// CORS proxy를 통해 API 호출 (공공데이터 API는 CORS 제한 있을 수 있음)
async function fetchData(productName, area, numOfRows) {
  const params = new URLSearchParams({
    serviceKey: API_KEY,
    numOfRows: numOfRows,
    pageNo: 1,
    type: 'xml',
    prdlstNm: productName,
  });
  if (area) params.append('area', area);

  // 직접 호출 시도 (CORS 허용된 경우)
  const url = `${BASE_URL}?${params}`;
  
  const response = await fetch(url, {
    method: 'GET',
    headers: { 'Accept': 'application/xml' }
  });
  
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const text = await response.text();
  return parseXML(text);
}

function parseXML(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  
  // 에러 체크
  const errMsg = doc.querySelector('errMsg');
  if (errMsg) throw new Error(errMsg.textContent);
  
  const returnAuthMsg = doc.querySelector('returnAuthMsg');
  if (returnAuthMsg && returnAuthMsg.textContent !== 'OK') {
    throw new Error(returnAuthMsg.textContent);
  }

  const items = doc.querySelectorAll('item');
  const results = [];

  items.forEach(item => {
    const get = (tag) => {
      const el = item.querySelector(tag);
      return el ? el.textContent.trim() : '';
    };

    results.push({
      productName: get('prdlstNm') || get('PRDLST_NM') || get('productName'),
      price: parseInt(get('prc') || get('PRC') || get('price') || '0'),
      storeName: get('mrktnm') || get('MRKTNM') || get('storeName'),
      area: get('area') || get('AREA'),
      surveyDate: get('srveydtm') || get('SRVEYDTM') || get('surveyDate'),
      unit: get('unit') || get('UNIT'),
      manufacturer: get('cmpny') || get('CMPNY') || get('manufacturer'),
      saleYn: get('saleYn') || get('SALE_YN'),
      salePrice: parseInt(get('salePrc') || get('SALE_PRC') || '0'),
    });
  });

  // totalCount
  const totalEl = doc.querySelector('totalCount');
  const total = totalEl ? parseInt(totalEl.textContent) : results.length;

  return { items: results, total };
}

function formatPrice(price) {
  if (!price || price === 0) return '-';
  return price.toLocaleString('ko-KR') + '원';
}

function formatDate(str) {
  if (!str) return '-';
  if (str.length === 8) return `${str.slice(0,4)}.${str.slice(4,6)}.${str.slice(6,8)}`;
  return str.slice(0,10).replace(/-/g,'.');
}

function renderStats(items) {
  const prices = items.map(i => i.price).filter(p => p > 0);
  if (!prices.length) return '';
  
  const avg = Math.round(prices.reduce((a,b) => a+b,0) / prices.length);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const diff = max - min;

  return `
    <div class="stats-grid">
      <div class="stat-card green">
        <div class="stat-label">최저가</div>
        <div class="stat-value">${formatPrice(min)}</div>
        <div class="stat-sub">전국 기준</div>
      </div>
      <div class="stat-card cyan">
        <div class="stat-label">평균가</div>
        <div class="stat-value">${formatPrice(avg)}</div>
        <div class="stat-sub">${items.length}개 매장</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">최고가</div>
        <div class="stat-value">${formatPrice(max)}</div>
        <div class="stat-sub">전국 기준</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">가격 편차</div>
        <div class="stat-value">${formatPrice(diff)}</div>
        <div class="stat-sub">최저↔최고</div>
      </div>
    </div>
  `;
}

function renderChart(items) {
  const withPrice = items.filter(i => i.price > 0);
  if (withPrice.length < 2) return '';
  
  // 판매점별 평균가
  const byStore = {};
  withPrice.forEach(i => {
    if (!i.storeName) return;
    if (!byStore[i.storeName]) byStore[i.storeName] = [];
    byStore[i.storeName].push(i.price);
  });

  const storeAvg = Object.entries(byStore)
    .map(([name, prices]) => ({
      name,
      avg: Math.round(prices.reduce((a,b)=>a+b,0)/prices.length)
    }))
    .sort((a,b) => a.avg - b.avg)
    .slice(0, 8);

  if (storeAvg.length < 2) return '';

  const maxAvg = Math.max(...storeAvg.map(s => s.avg));
  const minAvg = Math.min(...storeAvg.map(s => s.avg));

  const bars = storeAvg.map((s, i) => {
    const pct = Math.round((s.avg / maxAvg) * 100);
    const ratio = (s.avg - minAvg) / (maxAvg - minAvg || 1);
    const cls = ratio < 0.33 ? 'low' : ratio < 0.66 ? 'mid' : 'high';
    return `
      <div class="bar-row">
        <div class="bar-label" title="${s.name}">${s.name}</div>
        <div class="bar-track">
          <div class="bar-fill ${cls}" style="width:${pct}%">
            <span class="bar-price">${s.avg.toLocaleString()}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="chart-section">
      <div class="section-title">// 판매점별 평균 가격 비교</div>
      <div class="bar-chart">${bars}</div>
    </div>
  `;
}

function renderTable(items, page) {
  const start = (page - 1) * itemsPerPage;
  const pageItems = items.slice(start, start + itemsPerPage);
  const totalPages = Math.ceil(items.length / itemsPerPage);

  const rows = pageItems.map(item => `
    <tr>
      <td><div class="product-name" title="${item.productName}">${item.productName || '-'}</div></td>
      <td><div class="store-name">${item.storeName || '-'}</div></td>
      <td>${item.area || '-'}</td>
      <td class="price-cell">${formatPrice(item.price)}</td>
      <td>${item.saleYn === 'Y' ? `<span class="sale-badge">SALE ${formatPrice(item.salePrice)}</span>` : '-'}</td>
      <td class="store-name">${formatDate(item.surveyDate)}</td>
    </tr>
  `).join('');

  // Pagination
  let pages = '';
  if (totalPages > 1) {
    const prev = page > 1 ? `<button class="page-btn" onclick="goPage(${page-1})">‹</button>` : `<button class="page-btn" disabled>‹</button>`;
    const next = page < totalPages ? `<button class="page-btn" onclick="goPage(${page+1})">›</button>` : `<button class="page-btn" disabled>›</button>`;
    
    let nums = '';
    for (let i = Math.max(1, page-2); i <= Math.min(totalPages, page+2); i++) {
      nums += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    pages = `<div class="pagination">${prev}${nums}${next}</div>`;
  }

  return `
    <div class="status-bar">
      <span>총 <span class="result-count">${items.length.toLocaleString()}</span>건의 결과</span>
      <span style="font-size:11px">${start+1}–${Math.min(start+itemsPerPage, items.length)} / ${items.length}</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>상품명</th>
            <th>판매점</th>
            <th>지역</th>
            <th>가격</th>
            <th>할인</th>
            <th>조사일</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pages}
  `;
}

function goPage(page) {
  currentPage = page;
  const area = document.getElementById('area').value;
  
  const content = document.getElementById('contentArea');
  const stats = renderStats(currentData);
  const table = renderTable(currentData, currentPage);
  const chart = renderChart(currentData);
  
  content.innerHTML = `
    <div class="tabs">
      <button class="tab active" onclick="switchTab('table')">📋 목록</button>
      <button class="tab" onclick="switchTab('chart')">📊 분석</button>
    </div>
    <div id="tableView">${stats}${table}</div>
    <div id="chartView" style="display:none">${stats}${chart}</div>
  `;
  
  window.scrollTo({ top: 300, behavior: 'smooth' });
}

function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t,i) => t.classList.toggle('active', (tab==='table'&&i===0)||(tab==='chart'&&i===1)));
  document.getElementById('tableView').style.display = tab === 'table' ? '' : 'none';
  document.getElementById('chartView').style.display = tab === 'chart' ? '' : 'none';
}

async function search() {
  const productName = document.getElementById('productName').value.trim();
  const area = document.getElementById('area').value;
  const numOfRows = document.getElementById('numOfRows').value;
  const btn = document.getElementById('searchBtn');
  const content = document.getElementById('contentArea');

  if (!productName) {
    content.innerHTML = `<div class="error-box">⚠️ 상품명을 입력해주세요.</div>`;
    return;
  }

  btn.disabled = true;
  currentPage = 1;

  content.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <span>데이터를 불러오는 중...</span>
    </div>
  `;

  try {
    const { items, total } = await fetchData(productName, area, numOfRows);
    currentData = items;

    if (items.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <h3>검색 결과가 없습니다</h3>
          <p>"${productName}" 관련 가격 정보를 찾을 수 없습니다.<br>다른 검색어를 시도해 보세요.</p>
        </div>
      `;
      return;
    }

    const stats = renderStats(items);
    const table = renderTable(items, currentPage);
    const chart = renderChart(items);

    content.innerHTML = `
      <div class="tabs">
        <button class="tab active" onclick="switchTab('table')">📋 목록</button>
        <button class="tab" onclick="switchTab('chart')">📊 분석</button>
      </div>
      <div id="tableView">${stats}${table}</div>
      <div id="chartView" style="display:none">${stats}${chart}</div>
    `;

  } catch (err) {
    console.error(err);
    content.innerHTML = `
      <div class="error-box">
        ⚠️ <div>
          <strong>데이터 불러오기 실패</strong><br>
          ${err.message}<br><br>
          <small style="opacity:0.7">
            CORS 정책으로 인해 브라우저에서 직접 API 호출이 차단될 수 있습니다.<br>
            서버 환경 또는 CORS 프록시를 통해 실행하시면 정상 작동합니다.<br>
            아래 데모 데이터로 UI를 미리 확인하실 수 있습니다.
          </small>
        </div>
      </div>
      <button class="btn-search" onclick="loadDemo()" style="margin-top:1rem;background:var(--accent2);color:#0a0c10">
        🎯 데모 데이터로 보기
      </button>
    `;
  } finally {
    btn.disabled = false;
  }
}

function loadDemo() {
  const productName = document.getElementById('productName').value || '라면';
  
  const stores = ['이마트', '홈플러스', 'GS마트', '롯데마트', 'CU', '세븐일레븐', '농협하나로마트', 'NC백화점'];
  const areas = ['서울', '부산', '대구', '인천', '광주', '대전', '경기', '경남'];
  const prices = [1200, 1350, 1180, 1450, 1280, 1380, 1150, 1420, 1300, 1250, 1480, 1320, 1260, 1400, 1190, 1360];
  
  const demoItems = Array.from({length: 32}, (_, i) => ({
    productName: `${productName} (${['신라면', '진라면', '안성탕면', '너구리'][i%4]})`,
    storeName: stores[i % stores.length],
    area: areas[i % areas.length],
    price: prices[i % prices.length],
    surveyDate: `2026050${(i%5)+1}`,
    unit: '1개',
    manufacturer: ['농심', '오뚜기', '삼양'][i%3],
    saleYn: i % 5 === 0 ? 'Y' : 'N',
    salePrice: i % 5 === 0 ? prices[i % prices.length] - 200 : 0,
  }));

  currentData = demoItems;
  currentPage = 1;

  const stats = renderStats(demoItems);
  const table = renderTable(demoItems, currentPage);
  const chart = renderChart(demoItems);
  const content = document.getElementById('contentArea');

  content.innerHTML = `
    <div class="error-box" style="border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.06);color:var(--accent3)">
      ⚡ 데모 데이터입니다. 실제 API 연동 시 실시간 가격 정보가 표시됩니다.
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('table')">📋 목록</button>
      <button class="tab" onclick="switchTab('chart')">📊 분석</button>
    </div>
    <div id="tableView">${stats}${table}</div>
    <div id="chartView" style="display:none">${stats}${chart}</div>
  `;
}

// Enter key
document.getElementById('productName').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});
</script>
