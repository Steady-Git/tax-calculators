<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연간 스케줄러</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f4ef;
  --paper: #fffefa;
  --ink: #1c1814;
  --ink2: #6b5e52;
  --line: #b8afa4;
  --accent: #2c5f8a;
  --hover: #e8f0f8;
  --shadow: rgba(28,24,20,0.08);
  --cell-h: 80px;
}

body {
  background: var(--bg);
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
}

.sidebar {
  width: 270px;
  min-height: 100vh;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  color: var(--ink);
  line-height: 1.3;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 12px;
}

.sidebar-label {
  font-size: 0.63rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink2);
  font-weight: 600;
  margin-bottom: 7px;
}

.period-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 6px;
  align-items: start;
}
.period-col { display: flex; flex-direction: column; gap: 4px; }
.period-mini-label {
  font-size: 0.6rem;
  color: var(--ink2);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.arrow-col {
  display: flex; align-items: center; justify-content: center;
  padding-top: 18px;
  color: var(--ink2); font-size: 0.85rem;
}

select, input[type="text"] {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.8rem;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 3px;
  padding: 5px 7px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
select:focus, input:focus { border-color: var(--accent); }
select { cursor: pointer; }

.color-swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.swatch {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid transparent;
  transition: border-color 0.15s, transform 0.1s; flex-shrink: 0;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: var(--ink); }

.btn {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em;
  padding: 8px 14px; border: none; border-radius: 3px;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--ink); color: #fff; width: 100%; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-save { background: #2c7a4b; color: #fff; }
.btn-load { background: #7a5c2c; color: #fff; }
.btn:hover { opacity: 0.82; }
.btn-row { display: flex; gap: 6px; }
.btn-row .btn { flex: 1; font-size: 0.73rem; padding: 7px 8px; }

.arc-list {
  display: flex; flex-direction: column; gap: 5px;
  max-height: 260px; overflow-y: auto;
}
.arc-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 8px; background: var(--bg); border-radius: 4px;
  font-size: 0.76rem; border: 1px solid transparent;
  transition: border-color 0.15s;
}
.arc-item:hover { border-color: var(--line); }
.arc-item.selected { border-color: var(--accent); background: var(--hover); }
.arc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.arc-text {
  flex: 1; color: var(--ink); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.arc-dates { font-size: 0.67rem; color: var(--ink2); white-space: nowrap; }
.arc-del-btn {
  background: none; border: none; cursor: pointer;
  color: #c0392b; font-size: 0.82rem; padding: 0 2px;
  opacity: 0.4; transition: opacity 0.15s; flex-shrink: 0;
  line-height: 1;
}
.arc-del-btn:hover { opacity: 1; }

hr.divider { border: none; border-top: 1px solid var(--line); }

.main {
  flex: 1; display: flex; justify-content: flex-start;
  padding: 48px 60px; overflow: auto;
}

.scheduler-wrap { position: relative; display: flex; }

.timeline {
  display: flex; flex-direction: column;
  position: relative; width: 62px; flex-shrink: 0; user-select: none;
}

/* Vertical main line */
.timeline::before {
  content: '';
  position: absolute;
  left: 40px; top: 36px; bottom: 0;
  width: 1.5px; background: var(--ink); z-index: 0;
}

.year-badge {
  font-family: 'Playfair Display', serif;
  font-size: 0.8rem; color: var(--ink2);
  letter-spacing: 0.08em; height: 36px;
  display: flex; align-items: center; padding-left: 2px;
}

.month-row {
  height: var(--cell-h);
  display: flex; align-items: flex-start; position: relative;
}
.month-num {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; color: var(--ink);
  width: 30px; text-align: right; line-height: 1;
  margin-top: -1px; flex-shrink: 0;
}
.month-tick {
  width: 10px; height: 1.5px; background: var(--ink);
  position: relative; top: 7px; flex-shrink: 0;
}

.timeline-end { position: relative; height: 6px; }
.timeline-end::before {
  content: ''; position: absolute; left: 40px; top: 0;
  width: 10px; height: 1.5px; background: var(--ink);
}

.arcs-svg {
  position: absolute; left: 50px; top: 0;
  pointer-events: none; overflow: visible;
}

.arc-label-input {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem; font-weight: 500;
  border: none; background: transparent; outline: none;
  width: 170px; cursor: text;
  padding: 2px 4px; border-radius: 2px;
  transition: background 0.15s;
}
.arc-label-input:hover { background: rgba(44,95,138,0.07); }
.arc-label-input:focus { background: rgba(44,95,138,0.12); }
.arc-label-input::placeholder { color: #c8bfb0; }

.toast {
  position: fixed; bottom: 28px; right: 28px;
  background: var(--ink); color: #fff;
  font-size: 0.78rem; padding: 10px 18px;
  border-radius: 5px; opacity: 0;
  transition: opacity 0.25s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<aside class="sidebar">
  <div>
    <h1>연간<br>스케줄러</h1>
  </div>

  <div>
    <div class="sidebar-label">기간 설정</div>
    <div class="period-grid">
      <div class="period-col">
        <div class="period-mini-label">시작</div>
        <select id="startMonth"></select>
        <select id="startDay"></select>
      </div>
      <div class="arrow-col">→</div>
      <div class="period-col">
        <div class="period-mini-label">종료</div>
        <select id="endMonth"></select>
        <select id="endDay"></select>
      </div>
    </div>
  </div>

  <div>
    <div class="sidebar-label">색상</div>
    <div class="color-swatches" id="swatches">
      <div class="swatch active" data-color="#2c5f8a" style="background:#2c5f8a"></div>
      <div class="swatch" data-color="#8a2c2c" style="background:#8a2c2c"></div>
      <div class="swatch" data-color="#2c7a4b" style="background:#2c7a4b"></div>
      <div class="swatch" data-color="#7a5c2c" style="background:#7a5c2c"></div>
      <div class="swatch" data-color="#5c2c7a" style="background:#5c2c7a"></div>
      <div class="swatch" data-color="#1c1814" style="background:#1c1814"></div>
      <div class="swatch" data-color="#1a7a7a" style="background:#1a7a7a"></div>
      <div class="swatch" data-color="#8a6c1a" style="background:#8a6c1a"></div>
    </div>
  </div>

  <div>
    <div class="sidebar-label">할 일 메모</div>
    <input type="text" id="arcLabel" placeholder="예: PSAT 준비, 회계 공부…" />
  </div>

  <button class="btn btn-primary" id="addBtn">＋ 포물선 추가</button>

  <hr class="divider">

  <div>
    <div class="sidebar-label">저장 / 불러오기</div>
    <div class="btn-row">
      <button class="btn btn-save" id="saveBtn">💾 저장</button>
      <button class="btn btn-load" id="loadBtn">📂 불러오기</button>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none">
  </div>

  <hr class="divider">

  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px;">
    <div class="sidebar-label">일정 목록 <span id="arcCount" style="font-weight:400;color:var(--ink2)"></span></div>
    <div class="arc-list" id="arcList"></div>
  </div>

  <button class="btn btn-danger" id="clearBtn">전체 삭제</button>
</aside>

<main class="main">
  <div class="scheduler-wrap" id="schedulerWrap">
    <div class="timeline" id="timeline"></div>
    <svg class="arcs-svg" id="arcsSvg"></svg>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CELL_H = 80;
const TOP_OFFSET = 36;
const DAYS_IN_MONTH = [0,31,28,31,30,31,30,31,31,30,31,30,31];

let arcs = [];
let selectedColor = '#2c5f8a';
let selectedArcId = null;

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Dropdowns ──
function buildMonthSelect(id, def) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement('option');
    o.value = m; o.textContent = m + '월';
    if (m === def) o.selected = true;
    sel.appendChild(o);
  }
}

function buildDaySelect(id, month, def) {
  const sel = document.getElementById(id);
  sel.innerHTML = '';
  const days = DAYS_IN_MONTH[month] || 31;
  for (let d = 1; d <= days; d++) {
    const o = document.createElement('option');
    o.value = d; o.textContent = d + '일';
    if (d === def) o.selected = true;
    sel.appendChild(o);
  }
}

buildMonthSelect('startMonth', 1);
buildMonthSelect('endMonth', 2);
buildDaySelect('startDay', 1, 1);
buildDaySelect('endDay', 2, 28);

document.getElementById('startMonth').addEventListener('change', function() {
  buildDaySelect('startDay', +this.value, 1);
});
document.getElementById('endMonth').addEventListener('change', function() {
  buildDaySelect('endDay', +this.value, DAYS_IN_MONTH[+this.value]);
});

// ── Swatches ──
document.querySelectorAll('.swatch').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    selectedColor = s.dataset.color;
  });
});

// ── Build Timeline HTML ──
const timeline = document.getElementById('timeline');
const yb = document.createElement('div');
yb.className = 'year-badge';
yb.textContent = new Date().getFullYear();
timeline.appendChild(yb);

for (let m = 1; m <= 12; m++) {
  const row = document.createElement('div');
  row.className = 'month-row';
  row.innerHTML = `<span class="month-num">${m}</span><div class="month-tick"></div>`;
  timeline.appendChild(row);
}
const endDiv = document.createElement('div');
endDiv.className = 'timeline-end';
timeline.appendChild(endDiv);

// ── Y coordinate ──
// month: 1-12, day: 1-31
// y1 is AT the start tick, y2 is AT the end tick (exact day position)
function getY(month, day) {
  const daysInM = DAYS_IN_MONTH[month] || 30;
  // day=1 → start of month row, day=max → end of month row
  const frac = (day - 1) / daysInM;
  return TOP_OFFSET + (month - 1) * CELL_H + frac * CELL_H;
}

function dateLabel(m, d) { return `${m}/${d}`; }

// ── Add ──
document.getElementById('addBtn').addEventListener('click', addArc);
document.getElementById('arcLabel').addEventListener('keydown', e => {
  if (e.key === 'Enter') addArc();
});

function addArc() {
  const sm = +document.getElementById('startMonth').value;
  const sd = +document.getElementById('startDay').value;
  const em = +document.getElementById('endMonth').value;
  const ed = +document.getElementById('endDay').value;

  if (sm * 1000 + sd > em * 1000 + ed) {
    showToast('종료일이 시작일보다 앞설 수 없어요'); return;
  }
  const label = document.getElementById('arcLabel').value.trim() || '할 일';
  arcs.push({ id: Date.now(), sm, sd, em, ed, color: selectedColor, label });
  document.getElementById('arcLabel').value = '';
  renderAll();
  showToast('일정이 추가됐어요');
}

// ── Delete ──
function deleteArc(id) {
  arcs = arcs.filter(a => a.id !== id);
  if (selectedArcId === id) selectedArcId = null;
  renderAll();
  showToast('삭제됐어요');
}

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!arcs.length) return;
  if (confirm('모든 일정을 삭제할까요?')) {
    arcs = []; selectedArcId = null; renderAll(); showToast('전체 삭제됐어요');
  }
});

// ── Save ──
document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ version: 1, arcs }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `schedule_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('저장 완료!');
});

// ── Load ──
document.getElementById('loadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data.arcs)) {
        arcs = data.arcs; selectedArcId = null;
        renderAll(); showToast('불러오기 완료!');
      } else throw 0;
    } catch { showToast('파일 형식이 올바르지 않아요'); }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── Render ──
function renderAll() { renderSvg(); renderList(); }

function renderSvg() {
  const svg = document.getElementById('arcsSvg');
  const totalH = TOP_OFFSET + 12 * CELL_H + 20;
  svg.style.height = totalH + 'px';

  // Column assignment
  const columns = [];
  for (const arc of arcs) {
    const s = arc.sm * 1000 + arc.sd;
    let placed = false;
    for (const col of columns) {
      const last = col[col.length - 1];
      if (s > last.em * 1000 + last.ed) { col.push(arc); placed = true; break; }
    }
    if (!placed) columns.push([arc]);
  }
  const arcCol = {};
  columns.forEach((col, ci) => col.forEach(a => arcCol[a.id] = ci));

  svg.innerHTML = '';

  for (const arc of arcs) {
    const col = arcCol[arc.id] ?? 0;
    const bulge = 50 + col * 66;
    const labelX = bulge + 14;

    const y1 = getY(arc.sm, arc.sd);
    const y2 = getY(arc.em, arc.ed);
    const midY = (y1 + y2) / 2;
    const ht = y2 - y1;

    // Clean bracket curve: starts and ends exactly at (0, y1) and (0, y2)
    // No straight arms — pure smooth bezier
    // Using cubic bezier: control points pull the curve outward symmetrically
    const ctrl = Math.max(ht * 0.55, 30); // control offset
    const pathD = `M 0 ${y1} C ${bulge} ${y1 + ctrl * 0.5}, ${bulge} ${y2 - ctrl * 0.5}, 0 ${y2}`;

    const isSelected = selectedArcId === arc.id;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => {
      selectedArcId = isSelected ? null : arc.id;
      renderAll();
    });

    // Wider invisible hit area
    const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hitPath.setAttribute('d', pathD);
    hitPath.setAttribute('stroke', 'transparent');
    hitPath.setAttribute('stroke-width', '18');
    hitPath.setAttribute('fill', 'none');
    g.appendChild(hitPath);

    // Visible arc path
    const visPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    visPath.setAttribute('d', pathD);
    visPath.setAttribute('stroke', arc.color);
    visPath.setAttribute('stroke-width', isSelected ? '2.4' : '1.7');
    visPath.setAttribute('fill', 'none');
    visPath.setAttribute('stroke-linecap', 'round');
    g.appendChild(visPath);

    // Small dots at exact start/end points on the line
    [y1, y2].forEach(y => {
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', '0');
      dot.setAttribute('cy', String(y));
      dot.setAttribute('r', '3');
      dot.setAttribute('fill', arc.color);
      dot.setAttribute('stroke', 'white');
      dot.setAttribute('stroke-width', '1');
      g.appendChild(dot);
    });

    // Label input
    const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
    fo.setAttribute('x', String(labelX));
    fo.setAttribute('y', String(midY - 13));
    fo.setAttribute('width', '200');
    fo.setAttribute('height', '26');

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;height:100%;';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'arc-label-input';
    inp.value = arc.label;
    inp.placeholder = '할 일 입력';
    inp.style.color = arc.color;
    inp.addEventListener('input', e => { arc.label = e.target.value; renderList(); });
    inp.addEventListener('click', e => e.stopPropagation());
    wrap.appendChild(inp);
    fo.appendChild(wrap);
    g.appendChild(fo);

    svg.appendChild(g);
  }

  const svgW = Math.max(300, 60 + columns.length * 66 + 240);
  svg.style.width = svgW + 'px';
  document.getElementById('schedulerWrap').style.minWidth = (62 + svgW) + 'px';
}

function renderList() {
  const list = document.getElementById('arcList');
  list.innerHTML = '';
  document.getElementById('arcCount').textContent = `(${arcs.length})`;

  if (!arcs.length) {
    list.innerHTML = '<div style="font-size:0.74rem;color:var(--line);padding:8px 4px;">아직 추가된 일정이 없어요</div>';
    return;
  }

  [...arcs].reverse().forEach(arc => {
    const item = document.createElement('div');
    item.className = 'arc-item' + (selectedArcId === arc.id ? ' selected' : '');

    const dot = document.createElement('div');
    dot.className = 'arc-dot';
    dot.style.background = arc.color;

    const text = document.createElement('div');
    text.className = 'arc-text';
    text.textContent = arc.label || '(미입력)';
    text.addEventListener('click', () => {
      selectedArcId = selectedArcId === arc.id ? null : arc.id;
      renderAll();
    });

    const dates = document.createElement('div');
    dates.className = 'arc-dates';
    dates.textContent = `${dateLabel(arc.sm, arc.sd)} – ${dateLabel(arc.em, arc.ed)}`;

    const delBtn = document.createElement('button');
    delBtn.className = 'arc-del-btn';
    delBtn.title = '삭제';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', e => { e.stopPropagation(); deleteArc(arc.id); });

    item.appendChild(dot);
    item.appendChild(text);
    item.appendChild(dates);
    item.appendChild(delBtn);
    list.appendChild(item);
  });
}

renderAll();
</script>
</body>
</html>
