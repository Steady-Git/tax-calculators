<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국가기술자격 종목 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --accent-glow: rgba(59,130,246,0.15);
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orb */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  /* Header */
  .header {
    margin-bottom: 48px;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-glow);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 100px;
    padding: 4px 14px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .header-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* Search panel */
  .search-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }

  .search-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .search-grid {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }

  @media (max-width: 640px) {
    .search-grid { grid-template-columns: 1fr; }
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
  }

  select option { background: var(--surface2); }

  .btn-search {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 28px;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
  }

  .btn-search:hover {
    background: #2563eb;
    box-shadow: 0 0 20px rgba(59,130,246,0.4);
  }

  .btn-search:active { transform: scale(0.97); }
  .btn-search:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-search svg {
    width: 16px;
    height: 16px;
    transition: transform 0.2s;
  }

  .btn-search:hover svg { transform: rotate(15deg); }

  /* API info row */
  .api-info {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .api-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
  }

  .api-endpoint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    min-height: 28px;
  }

  .status-msg {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-msg.loading { color: var(--accent2); }
  .status-msg.success { color: var(--success); }
  .status-msg.error { color: var(--danger); }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(96,165,250,0.2);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .count-badge {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--accent-glow);
    border: 1px solid rgba(59,130,246,0.2);
    color: var(--accent2);
    border-radius: 100px;
    padding: 2px 12px;
  }

  /* Table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  th {
    text-align: left;
    padding: 12px 16px;
    font-size: 10px;
    font-family: var(--mono);
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid rgba(30,45,69,0.6);
    transition: background 0.15s;
    animation: fadeIn 0.3s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  tbody tr:hover { background: rgba(59,130,246,0.05); }
  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 13px 16px;
    color: var(--text-dim);
    vertical-align: middle;
  }

  td:first-child {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  td .name-main {
    color: var(--text);
    font-weight: 500;
    margin-bottom: 2px;
  }

  td .name-en {
    color: var(--text-muted);
    font-size: 11px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 10px;
    font-family: var(--mono);
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .badge-series { background: rgba(59,130,246,0.15); color: var(--accent2); }
  .badge-type { background: rgba(16,185,129,0.12); color: #34d399; }
  .badge-grade { background: rgba(245,158,11,0.12); color: #fbbf24; }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .page-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 12px;
    transition: all 0.15s;
  }

  .page-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent2);
  }

  .page-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Empty / Error states */
  .empty-state {
    text-align: center;
    padding: 64px 24px;
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .empty-desc {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-badge">Q-NET Open API</div>
    <h1>국가기술자격<br>종목 조회 시스템</h1>
    <p class="subtitle">한국산업인력공단 · 국가자격 종목 목록 정보</p>
  </header>

  <div class="search-panel">
    <div class="search-grid">
      <div class="field-group">
        <label>자격증명 검색</label>
        <input type="text" id="searchKeyword" placeholder="예: 정보처리, 전기, 용접..." />
      </div>
      <div class="field-group">
        <label>계열 필터</label>
        <select id="seriesFilter">
          <option value="">전체 계열</option>
          <option value="01">기술·기능</option>
          <option value="02">서비스</option>
        </select>
      </div>
      <button class="btn-search" id="searchBtn" onclick="doSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        조회
      </button>
    </div>
    <div class="api-info">
      <span class="api-tag">REST</span>
      <span class="api-tag">XML</span>
      <span class="api-endpoint">openapi.q-net.or.kr / InquiryListNationalQualifcationSVC</span>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-msg" id="statusMsg">검색어를 입력하고 조회 버튼을 눌러주세요</div>
    <div id="countBadge"></div>
  </div>

  <div id="resultArea"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
  const API_KEY = 'dc8294cd0177c5d51b45be29652fb691c4b18e055f22c87b0967ca1a78c7df0a';
  const BASE_URL = 'https://openapi.q-net.or.kr/api/service/rest/InquiryListNationalQualifcationSVC/getList';

  let currentPage = 1;
  let totalCount = 0;
  let pageSize = 10;
  let lastKeyword = '';
  let lastSeries = '';

  // Enter key support
  document.getElementById('searchKeyword').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  function setStatus(msg, type = '') {
    const el = document.getElementById('statusMsg');
    el.className = 'status-msg' + (type ? ' ' + type : '');
    if (type === 'loading') {
      el.innerHTML = `<div class="spinner"></div>${msg}`;
    } else {
      el.textContent = msg;
    }
  }

  function setCount(n) {
    const el = document.getElementById('countBadge');
    if (n !== null) {
      el.innerHTML = `<span class="count-badge">총 ${n.toLocaleString()}건</span>`;
    } else {
      el.innerHTML = '';
    }
  }

  async function doSearch(page = 1) {
    const keyword = document.getElementById('searchKeyword').value.trim();
    const series = document.getElementById('seriesFilter').value;
    lastKeyword = keyword;
    lastSeries = series;
    currentPage = page;

    setStatus('데이터를 불러오는 중...', 'loading');
    setCount(null);
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('searchBtn').disabled = true;

    // Build proxy URL (CORS 우회를 위해 allorigins 사용)
    const params = new URLSearchParams({
      serviceKey: API_KEY,
      pageNo: page,
      numOfRows: pageSize,
    });
    if (keyword) params.append('implNm', keyword);
    if (series) params.append('seriesCd', series);

    const targetUrl = `${BASE_URL}?${params.toString()}`;
    // allorigins proxy for CORS
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

    try {
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const xmlText = json.contents;

      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');

      // Check for API error
      const resultCode = xml.querySelector('resultCode')?.textContent;
      const resultMsg = xml.querySelector('resultMsg')?.textContent;

      if (resultCode && resultCode !== '00' && resultCode !== '0000') {
        throw new Error(resultMsg || '알 수 없는 오류');
      }

      const total = parseInt(xml.querySelector('totalCount')?.textContent || '0');
      totalCount = total;

      const items = xml.querySelectorAll('item');
      setCount(total);

      if (items.length === 0) {
        setStatus('검색 결과가 없습니다', '');
        renderEmpty();
        document.getElementById('searchBtn').disabled = false;
        return;
      }

      setStatus(`${total.toLocaleString()}건 조회 완료`, 'success');
      renderTable(items);
      renderPagination(total);
    } catch (err) {
      console.error(err);
      setStatus(`오류: ${err.message}`, 'error');
      renderError(err.message);
    }

    document.getElementById('searchBtn').disabled = false;
  }

  function getText(item, tag) {
    return item.querySelector(tag)?.textContent?.trim() || '-';
  }

  function renderTable(items) {
    const rows = Array.from(items).map((item, i) => {
      const delay = i * 40;
      const jmcd = getText(item, 'jmCd');
      const name = getText(item, 'jmNm');
      const nameEn = getText(item, 'jmNmEn');
      const series = getText(item, 'seriesNm');
      const oblgFldNm = getText(item, 'oblgFldNm');
      const grdNm = getText(item, 'grdNm');
      const instiNm = getText(item, 'instiNm');

      return `
        <tr style="animation-delay:${delay}ms">
          <td>${jmcd}</td>
          <td>
            <div class="name-main">${name}</div>
            ${nameEn !== '-' ? `<div class="name-en">${nameEn}</div>` : ''}
          </td>
          <td>${series !== '-' ? `<span class="badge badge-series">${series}</span>` : '-'}</td>
          <td>${oblgFldNm !== '-' ? `<span class="badge badge-type">${oblgFldNm}</span>` : '-'}</td>
          <td>${grdNm !== '-' ? `<span class="badge badge-grade">${grdNm}</span>` : '-'}</td>
          <td>${instiNm}</td>
        </tr>`;
    }).join('');

    document.getElementById('resultArea').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>종목코드</th>
              <th>자격증명</th>
              <th>계열</th>
              <th>분야</th>
              <th>등급</th>
              <th>시행기관</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderPagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    if (totalPages <= 1) return;

    const maxVisible = 7;
    let start = Math.max(1, currentPage - 3);
    let end = Math.min(totalPages, start + maxVisible - 1);
    if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

    let html = `
      <button class="page-btn" onclick="doSearch(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

    if (start > 1) html += `<button class="page-btn" onclick="doSearch(1)">1</button>${start > 2 ? '<span style="color:var(--text-muted);padding:0 4px">…</span>' : ''}`;

    for (let p = start; p <= end; p++) {
      html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="doSearch(${p})">${p}</button>`;
    }

    if (end < totalPages) html += `${end < totalPages - 1 ? '<span style="color:var(--text-muted);padding:0 4px">…</span>' : ''}<button class="page-btn" onclick="doSearch(${totalPages})">${totalPages}</button>`;

    html += `<button class="page-btn" onclick="doSearch(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;

    document.getElementById('pagination').innerHTML = html;
  }

  function renderEmpty() {
    document.getElementById('resultArea').innerHTML = `
      <div class="table-wrap">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">검색 결과 없음</div>
          <div class="empty-desc">다른 검색어로 다시 시도해 보세요</div>
        </div>
      </div>`;
  }

  function renderError(msg) {
    document.getElementById('resultArea').innerHTML = `
      <div class="table-wrap">
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div class="empty-title">데이터 조회 실패</div>
          <div class="empty-desc">${msg}<br><br>
            <small style="color:var(--text-muted)">
              CORS 제한으로 인해 브라우저에서 직접 API 호출이 제한될 수 있습니다.<br>
              서버사이드 프록시 환경에서 실행하거나, API 포털에서 CORS 허용 설정을 확인하세요.
            </small>
          </div>
        </div>
      </div>`;
  }

  // Initial load with empty search
  window.addEventListener('load', () => doSearch(1));
</script>
</body>
</html>
