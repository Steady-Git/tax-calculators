<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연간 스케줄러</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f4ef;
  --paper: #fffefa;
  --ink: #1c1814;
  --ink2: #6b5e52;
  --line: #b8afa4;
  --accent: #2c5f8a;
  --accent2: #8a2c2c;
  --accent3: #2c7a4b;
  --accent4: #7a5c2c;
  --hover: #e8f0f8;
  --arc-default: #2c5f8a;
  --shadow: rgba(28,24,20,0.08);
  --cell-h: 72px;
}

body {
  background: var(--bg);
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  gap: 0;
}

/* ── Sidebar ── */
.sidebar {
  width: 260px;
  min-height: 100vh;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  flex-shrink: 0;
}

.sidebar h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  color: var(--ink);
  line-height: 1.3;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 12px;
}

.sidebar-label {
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink2);
  font-weight: 600;
  margin-bottom: 8px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

select, input[type="text"] {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.82rem;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 3px;
  padding: 6px 8px;
  outline: none;
  transition: border-color 0.15s;
}
select:focus, input:focus { border-color: var(--accent); }
select { cursor: pointer; }

.color-swatches {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.swatch {
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s, transform 0.1s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: var(--ink); }

.btn {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 9px 16px;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--ink);
  color: #fff;
  width: 100%;
}
.btn-danger {
  background: #c0392b;
  color: #fff;
  font-size: 0.75rem;
  padding: 5px 10px;
}
.btn:hover { opacity: 0.85; }

.arc-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 300px;
  overflow-y: auto;
}
.arc-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg);
  border-radius: 4px;
  font-size: 0.78rem;
  cursor: pointer;
  border: 1px solid transparent;
  transition: border-color 0.15s;
}
.arc-item:hover { border-color: var(--line); }
.arc-item.selected { border-color: var(--accent); background: var(--hover); }
.arc-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.arc-text { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arc-months { font-size: 0.7rem; color: var(--ink2); white-space: nowrap; }

hr.divider { border: none; border-top: 1px solid var(--line); }

/* ── Main canvas ── */
.main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 48px 60px;
  overflow-x: auto;
}

.scheduler-wrap {
  position: relative;
  display: flex;
  gap: 0;
}

/* Timeline column */
.timeline {
  display: flex;
  flex-direction: column;
  position: relative;
  width: 60px;
  flex-shrink: 0;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 38px;
  top: 0; bottom: 0;
  width: 1.5px;
  background: var(--ink);
  z-index: 0;
}

.month-row {
  height: var(--cell-h);
  display: flex;
  align-items: flex-start;
  position: relative;
  padding-top: 0;
}

.month-num {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  color: var(--ink);
  width: 28px;
  text-align: right;
  line-height: 1;
  margin-top: -2px;
  flex-shrink: 0;
}

.month-tick {
  width: 10px;
  height: 1.5px;
  background: var(--ink);
  margin-left: 0;
  margin-top: 0;
  flex-shrink: 0;
  position: relative;
  top: 6px;
}

/* End cap */
.timeline-end {
  height: 0;
  position: relative;
}
.timeline-end::before {
  content: '';
  position: absolute;
  left: 38px;
  top: 0;
  width: 10px;
  height: 1.5px;
  background: var(--ink);
}

/* SVG arcs overlay */
.arcs-svg {
  position: absolute;
  left: 48px;
  top: 0;
  pointer-events: none;
  overflow: visible;
}

/* Arc label foreignObject */
.arc-fo {
  overflow: visible;
}

.arc-label-wrap {
  display: flex;
  align-items: center;
  height: 100%;
}

.arc-label-input {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--ink);
  outline: none;
  width: 160px;
  cursor: text;
  padding: 2px 4px;
  border-radius: 2px;
  transition: background 0.15s;
}
.arc-label-input:hover { background: rgba(44,95,138,0.07); }
.arc-label-input:focus { background: rgba(44,95,138,0.12); }
.arc-label-input::placeholder { color: var(--line); }

/* instruction */
.instruction {
  position: fixed;
  bottom: 24px;
  right: 28px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 16px;
  font-size: 0.72rem;
  color: var(--ink2);
  line-height: 1.7;
  box-shadow: 0 2px 12px var(--shadow);
  max-width: 220px;
}
.instruction b { color: var(--ink); font-weight: 600; }

/* year label */
.year-badge {
  font-family: 'Playfair Display', serif;
  font-size: 0.85rem;
  color: var(--ink2);
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div>
    <h1>연간<br>스케줄러</h1>
  </div>

  <div>
    <div class="sidebar-label">기간 설정</div>
    <div class="form-group">
      <div class="form-row">
        <select id="startMonth" style="flex:1">
          <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">${i}월</option>`);</script>
        </select>
        <span style="color:var(--ink2);font-size:0.8rem">→</span>
        <select id="endMonth" style="flex:1">
          <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}" ${i===2?'selected':''}>${i}월</option>`);</script>
        </select>
      </div>
    </div>
  </div>

  <div>
    <div class="sidebar-label">색상</div>
    <div class="color-swatches" id="swatches">
      <div class="swatch active" data-color="#2c5f8a" style="background:#2c5f8a"></div>
      <div class="swatch" data-color="#8a2c2c" style="background:#8a2c2c"></div>
      <div class="swatch" data-color="#2c7a4b" style="background:#2c7a4b"></div>
      <div class="swatch" data-color="#7a5c2c" style="background:#7a5c2c"></div>
      <div class="swatch" data-color="#5c2c7a" style="background:#5c2c7a"></div>
      <div class="swatch" data-color="#1c1814" style="background:#1c1814"></div>
    </div>
  </div>

  <div>
    <div class="sidebar-label">할 일 메모</div>
    <div class="form-group">
      <input type="text" id="arcLabel" placeholder="예: PSAT 준비, 회계 공부…" />
    </div>
  </div>

  <button class="btn btn-primary" id="addBtn">+ 포물선 추가</button>

  <hr class="divider">

  <div>
    <div class="sidebar-label">추가된 일정 <span id="arcCount" style="font-weight:400;color:var(--ink2)"></span></div>
    <div class="arc-list" id="arcList"></div>
  </div>

  <div style="margin-top:auto">
    <button class="btn btn-danger" id="clearBtn" style="width:100%">전체 삭제</button>
  </div>
</aside>

<!-- ── MAIN ── -->
<main class="main">
  <div class="scheduler-wrap" id="schedulerWrap">
    <!-- Timeline -->
    <div class="timeline" id="timeline">
      <div class="year-badge" style="margin-left:0;margin-bottom:6px;width:60px;text-align:right;padding-right:0;font-size:0.75rem;color:var(--ink2)">2025</div>
    </div>

    <!-- SVG overlay for arcs -->
    <svg class="arcs-svg" id="arcsSvg" style="width:320px;height:100%"></svg>
  </div>
</main>

<div class="instruction">
  <b>사용법</b><br>
  ① 시작/끝 월 선택<br>
  ② 색상 선택<br>
  ③ 할 일 입력<br>
  ④ 포물선 추가 클릭<br>
  ⑤ 텍스트는 직접 수정 가능
</div>

<script>
const CELL_H = 72;
const MONTHS = 12;
const TOP_OFFSET = 36; // for year badge height

let arcs = [];
let selectedColor = '#2c5f8a';
let selectedArcId = null;

// ── Build timeline ──
const timeline = document.getElementById('timeline');
for (let m = 1; m <= 12; m++) {
  const row = document.createElement('div');
  row.className = 'month-row';
  row.innerHTML = `
    <span class="month-num">${m}</span>
    <div class="month-tick"></div>
  `;
  timeline.appendChild(row);
}
// end cap
const endDiv = document.createElement('div');
endDiv.className = 'timeline-end';
timeline.appendChild(endDiv);

// ── Color swatches ──
document.querySelectorAll('.swatch').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    selectedColor = s.dataset.color;
  });
});

// ── Add arc ──
document.getElementById('addBtn').addEventListener('click', () => {
  const start = parseInt(document.getElementById('startMonth').value);
  const end = parseInt(document.getElementById('endMonth').value);
  if (end < start) { alert('끝 월은 시작 월보다 크거나 같아야 합니다.'); return; }

  const label = document.getElementById('arcLabel').value.trim() || '할 일';
  const id = Date.now();

  arcs.push({ id, start, end, color: selectedColor, label });
  document.getElementById('arcLabel').value = '';
  renderAll();
});

// ── Clear ──
document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('모든 일정을 삭제할까요?')) { arcs = []; selectedArcId = null; renderAll(); }
});

// ── Render ──
function renderAll() {
  renderSvg();
  renderList();
}

function getY(month) {
  // month 1 → top of cell 0, month 13 → bottom of cell 12
  return TOP_OFFSET + (month - 1) * CELL_H;
}

function renderSvg() {
  const svg = document.getElementById('arcsSvg');
  // Update SVG height
  const totalH = TOP_OFFSET + 12 * CELL_H + 20;
  svg.style.height = totalH + 'px';

  // Group arcs by column to avoid overlap
  // Assign column index per arc (greedy)
  const columns = []; // each column is array of arcs sorted by start
  for (const arc of arcs) {
    let placed = false;
    for (const col of columns) {
      const last = col[col.length - 1];
      if (arc.start > last.end) { col.push(arc); placed = true; break; }
    }
    if (!placed) columns.push([arc]);
  }

  // Build arc-to-column map
  const arcCol = {};
  columns.forEach((col, ci) => col.forEach(a => arcCol[a.id] = ci));

  svg.innerHTML = '';

  for (const arc of arcs) {
    const col = arcCol[arc.id] ?? 0;
    const x0 = 0;            // start of bracket on the line
    const bulge = 56 + col * 70; // how far right the arc bows
    const labelX = bulge + 10;
    const y1 = getY(arc.start);
    const y2 = getY(arc.end + 1); // end of that month
    const midY = (y1 + y2) / 2;
    const ht = y2 - y1;

    // SVG path: bracket shape (right-opening)
    // top arm + curve + bottom arm
    const path = `
      M ${x0} ${y1}
      L ${x0} ${y1 + ht * 0.08}
      C ${bulge} ${y1 + ht * 0.08}, ${bulge} ${midY - ht * 0.04}, ${bulge} ${midY}
      C ${bulge} ${midY + ht * 0.04}, ${bulge} ${y2 - ht * 0.08}, ${x0} ${y2 - ht * 0.08}
      L ${x0} ${y2}
    `;

    const isSelected = selectedArcId === arc.id;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => {
      selectedArcId = isSelected ? null : arc.id;
      renderAll();
    });

    // hit area
    const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hitPath.setAttribute('d', path);
    hitPath.setAttribute('stroke', 'transparent');
    hitPath.setAttribute('stroke-width', '18');
    hitPath.setAttribute('fill', 'none');
    g.appendChild(hitPath);

    // visible path
    const visPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    visPath.setAttribute('d', path);
    visPath.setAttribute('stroke', arc.color);
    visPath.setAttribute('stroke-width', isSelected ? '2.2' : '1.6');
    visPath.setAttribute('fill', 'none');
    visPath.setAttribute('stroke-linecap', 'round');
    g.appendChild(visPath);

    // label via foreignObject
    const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
    fo.setAttribute('x', labelX);
    fo.setAttribute('y', midY - 14);
    fo.setAttribute('width', '200');
    fo.setAttribute('height', '28');

    const div = document.createElement('div');
    div.className = 'arc-label-wrap';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'arc-label-input';
    inp.value = arc.label;
    inp.placeholder = '할 일 입력';
    inp.style.color = arc.color;
    inp.addEventListener('input', e => {
      arc.label = e.target.value;
      renderList();
    });
    inp.addEventListener('click', e => e.stopPropagation());
    div.appendChild(inp);
    fo.appendChild(div);
    g.appendChild(fo);

    // delete button if selected
    if (isSelected) {
      const delBtn = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      delBtn.setAttribute('x', labelX + 175);
      delBtn.setAttribute('y', midY + 5);
      delBtn.setAttribute('font-size', '14');
      delBtn.setAttribute('fill', '#c0392b');
      delBtn.setAttribute('cursor', 'pointer');
      delBtn.setAttribute('font-family', 'sans-serif');
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        arcs = arcs.filter(a => a.id !== arc.id);
        selectedArcId = null;
        renderAll();
      });
      g.appendChild(delBtn);
    }

    svg.appendChild(g);
  }

  // Update SVG width based on max columns
  const maxCol = columns.length;
  const svgW = Math.max(320, 80 + maxCol * 70 + 220);
  svg.style.width = svgW + 'px';
  document.getElementById('schedulerWrap').style.minWidth = (80 + svgW) + 'px';
}

function renderList() {
  const list = document.getElementById('arcList');
  list.innerHTML = '';
  document.getElementById('arcCount').textContent = `(${arcs.length})`;

  if (arcs.length === 0) {
    list.innerHTML = '<div style="font-size:0.75rem;color:var(--line);padding:8px 4px;">아직 추가된 일정이 없어요</div>';
    return;
  }

  [...arcs].reverse().forEach(arc => {
    const item = document.createElement('div');
    item.className = 'arc-item' + (selectedArcId === arc.id ? ' selected' : '');
    item.innerHTML = `
      <div class="arc-dot" style="background:${arc.color}"></div>
      <div class="arc-text">${arc.label || '(미입력)'}</div>
      <div class="arc-months">${arc.start}–${arc.end}월</div>
    `;
    item.addEventListener('click', () => {
      selectedArcId = selectedArcId === arc.id ? null : arc.id;
      renderAll();
    });
    list.appendChild(item);
  });
}

// initial render
renderAll();
</script>
</body>
</html>
