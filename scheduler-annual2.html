<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연간 스케줄러</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f4ef;
  --paper: #fffefa;
  --ink: #1c1814;
  --ink2: #6b5e52;
  --line: #b8afa4;
  --accent: #2c5f8a;
  --hover: #e8f0f8;
  --cell-h: 80px;
}

body {
  background: var(--bg);
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  display: flex;
}

/* ── Sidebar ── */
.sidebar {
  width: 280px;
  min-height: 100vh;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: visible;
}

.sidebar h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  color: var(--ink);
  line-height: 1.3;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 12px;
}

.sidebar-label {
  font-size: 0.63rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink2);
  font-weight: 600;
  margin-bottom: 7px;
}

.period-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 6px;
  align-items: start;
}
.period-col { display: flex; flex-direction: column; gap: 4px; }
.period-mini-label { font-size: 0.6rem; color: var(--ink2); letter-spacing: 0.1em; text-transform: uppercase; }
.arrow-col { display: flex; align-items: center; justify-content: center; padding-top: 18px; color: var(--ink2); font-size: 0.85rem; }

select, input[type="text"] {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.8rem;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 3px;
  padding: 5px 7px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
select:focus, input:focus { border-color: var(--accent); }
select { cursor: pointer; }

.color-swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.swatch {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid transparent;
  transition: border-color 0.15s, transform 0.1s; flex-shrink: 0;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: var(--ink); }

.btn {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em;
  padding: 8px 14px; border: none; border-radius: 3px;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--ink); color: #fff; width: 100%; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-save { background: #2c7a4b; color: #fff; }
.btn-load { background: #7a5c2c; color: #fff; }
.btn:hover { opacity: 0.82; }
.btn-row { display: flex; gap: 6px; }
.btn-row .btn { flex: 1; font-size: 0.73rem; padding: 7px 8px; }

.arc-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  overflow-y: auto;
  min-height: 60px;
  padding-right: 2px;
}

.arc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  background: var(--bg);
  border-radius: 8px;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}
.arc-item:hover { background: #f0ede6; }
.arc-item.selected { border-color: var(--accent); background: var(--hover); }

.arc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.arc-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.arc-text {
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 0.8rem; font-weight: 500;
}
.arc-dates { font-size: 0.67rem; color: var(--ink2); white-space: nowrap; }

.arc-del-btn {
  background: none; border: none; cursor: pointer;
  color: var(--line); font-size: 1rem; line-height: 1;
  padding: 2px 4px; flex-shrink: 0;
  transition: color 0.15s;
  border-radius: 4px;
}
.arc-del-btn:hover { color: #c0392b; background: #fdf0ee; }

.arc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.arc-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.arc-text { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.78rem; font-weight: 500; }
.arc-dates { font-size: 0.65rem; color: var(--ink2); white-space: nowrap; }

/* Confirm delete btn (appears on reveal) */
.arc-del-confirm {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 72px;
  background: #c0392b;
  color: #fff;
  border: none; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.72rem; font-weight: 700;
  border-radius: 0 8px 8px 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s;
}
.arc-item-wrap.reveal .arc-del-confirm {
  opacity: 1;
  pointer-events: all;
}
hr.divider { border: none; border-top: 1px solid var(--line); }

/* ── Main ── */
.main { flex: 1; display: flex; padding: 48px 60px; overflow: auto; }
.canvas-wrap { position: relative; display: inline-flex; align-items: flex-start; }

/*
  Timeline is an SVG.
  We draw everything in one SVG so coordinates are consistent.
*/
#mainSvg {
  display: block;
  overflow: visible;
  pointer-events: none;
}
#mainSvg .arc-group { pointer-events: all; cursor: pointer; }

.arc-label-input {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.78rem; font-weight: 500;
  border: none; background: transparent; outline: none;
  width: 180px; cursor: text;
  padding: 2px 4px; border-radius: 2px;
  transition: background 0.15s;
  color: inherit;
}
.arc-label-input:hover { background: rgba(44,95,138,0.08); }
.arc-label-input:focus { background: rgba(44,95,138,0.14); }
.arc-label-input::placeholder { color: #c8bfb0; }

.toast {
  position: fixed; bottom: 28px; right: 28px;
  background: var(--ink); color: #fff;
  font-size: 0.78rem; padding: 10px 18px;
  border-radius: 5px; opacity: 0;
  transition: opacity 0.25s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; }

/* ── Main inner layout ── */
.main-inner {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 28px;
  min-width: 0;
}

/* ── Year card ── */
.year-card {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--paper);
  border-radius: 20px;
  box-shadow: 0 2px 16px rgba(28,24,20,0.10);
  padding: 18px 28px;
  min-width: 320px;
  width: 380px;
}
.year-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: #ece9e3;
  border: none;
  font-size: 1.1rem;
  color: #6b5e52;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.year-btn:hover { background: #ddd9d0; }
.year-btn:active { transform: scale(0.93); }
.year-center {
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px;
}
.year-num {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  color: #1c1814;
  letter-spacing: 0.02em;
  line-height: 1;
}
.year-sub {
  font-size: 0.78rem;
  color: #b8afa4;
  letter-spacing: 0.12em;
}

/* ── Mobile toggle button ── */
.panel-toggle {
  display: none; /* hidden on desktop */
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 12px 24px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: opacity 0.15s, transform 0.1s;
}
.panel-toggle:active { transform: translateX(-50%) scale(0.95); }

/* ── Mobile layout ── */
@media (max-width: 700px) {
  body { flex-direction: column; }

  .panel-toggle { display: flex; }

  .sidebar {
    position: fixed;
    top: 0; left: 0; right: 0;
    width: 100%;
    min-height: unset;
    max-height: 80vh;
    overflow-y: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
    z-index: 100;
    transform: translateY(0);
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }

  .sidebar.collapsed {
    transform: translateY(-100%);
    pointer-events: none;
  }

  .main {
    padding: 16px 16px 80px;
    margin-top: 0;
    /* when sidebar is open, push content down */
    transition: padding-top 0.3s cubic-bezier(.4,0,.2,1);
  }

  .main.sidebar-open {
    /* rough height of sidebar — JS will set exact value */
    padding-top: var(--sidebar-h, 420px);
  }

  .year-card {
    width: 100%;
    min-width: unset;
  }

  .main-inner {
    width: 100%;
  }
}

/* ── Date picker button ── */
.date-picker-row {
  display: flex; align-items: center; gap: 6px;
  overflow: visible;
}
.date-pick-btn {
  flex: 1; min-width: 0; padding: 7px 6px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; cursor: pointer;
  transition: border-color 0.15s;
  overflow: visible;
  box-sizing: border-box;
}
.date-pick-btn:hover { border-color: var(--accent); }
.date-pick-btn.active { border-color: var(--accent); background: var(--hover); }
.date-pick-label { font-size: 0.58rem; color: var(--ink2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
.date-pick-val { font-size: 0.72rem; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: clip; }
.date-pick-val.empty { color: var(--line); }
.date-arrow { color: var(--ink2); font-size: 0.85rem; flex-shrink: 0; }

/* ── Calendar overlay ── */
/* ══ Calendar Overlay ══ */
/* ══ Calendar ══ */
.cal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 1000;
}
.cal-overlay.show { display: block; }

.cal-popup {
  display: none; position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 320px; border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 16px 56px rgba(0,0,0,0.3);
  z-index: 1001;
  font-family: 'Noto Sans KR', sans-serif;
  background: #fff;
  flex-direction: column;
}
.cal-popup.show { display: flex; }

/* Header */
.cal-header {
  background: #4a6fa5;
  padding: 16px 20px 14px;
  color: #fff;
  user-select: none;
}
.cal-header-year-row {
  font-size: 0.75rem; opacity: 0.8;
  margin-bottom: 3px;
  display: inline-flex; align-items: center; gap: 5px;
  cursor: pointer; transition: opacity 0.15s;
}
.cal-header-year-row:hover { opacity: 1; }
.cal-header-main {
  font-size: 1.5rem; font-weight: 700; line-height: 1.2;
}

/* Year picker */
.cal-year-list {
  display: none;
  overflow-y: auto;
  max-height: 260px;
  background: #fff;
}
.cal-year-list.show { display: block; }
.cal-year-row {
  text-align: center;
  padding: 12px 0;
  font-size: 1rem; color: #333;
  cursor: pointer;
  transition: background 0.1s;
}
.cal-year-row:hover { background: #f0f4f9; }
.cal-year-row.cur {
  font-size: 1.4rem; font-weight: 700;
  color: #4a6fa5;
}

/* Month view */
.cal-month-view { overflow: hidden; }
.cal-month-inner {
  padding: 10px 16px 6px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

/* Nav */
.cal-nav {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cal-nav-lbl { font-size: 0.88rem; font-weight: 600; color: #222; }
.cal-nav-btn {
  background: none; border: none;
  font-size: 1.4rem; line-height: 1;
  color: #888; cursor: pointer;
  padding: 2px 8px; border-radius: 6px;
  transition: background 0.12s, color 0.12s;
}
.cal-nav-btn:hover { background: #f0ece4; color: #333; }

/* Weekdays */
.cal-wdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  margin-bottom: 4px;
}
.cal-wdays span {
  font-size: 0.66rem; color: #bbb;
  font-weight: 600; padding: 2px 0;
}
.cal-wdays span:first-child { color: #e06060; }
.cal-wdays span:last-child  { color: #6080e0; }

/* Grid — always 6 rows × 7 cols */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 0;
  aspect-ratio: 7 / 6;
}
.cal-cell {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.82rem; color: #222;
  cursor: pointer; border-radius: 50%;
  transition: background 0.1s;
  aspect-ratio: 1;
  margin: 1px auto;
  width: 32px; height: 32px;
}
.cal-cell:hover { background: #eef2f8; }
.cal-cell.dim   { color: #ccc; pointer-events: none; }
.cal-cell.dim:hover { background: none; }
.cal-cell.now   { color: #4a6fa5; font-weight: 700; }
.cal-cell.pick  { background: #4a6fa5; color: #fff; font-weight: 700; border-radius: 50%; }
.cal-cell.pick:hover { background: #3a5f95; }
.cal-cell.sun   { color: #e06060; }
.cal-cell.sat   { color: #6080e0; }
.cal-cell.pick.sun, .cal-cell.pick.sat { color: #fff; }

/* Footer */
.cal-footer {
  border-top: 1px solid #f0f0f0;
  display: flex; align-items: center;
  padding: 8px 14px 12px;
  background: #fff;
}
.cal-foot-del    { color: #c0392b; margin-right: auto; }
.cal-foot-cancel { color: #666; }
.cal-foot-ok     { color: #4a6fa5; }
.cal-foot-del, .cal-foot-cancel, .cal-foot-ok {
  background: none; border: none;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.9rem; font-weight: 600;
  padding: 7px 14px; border-radius: 8px;
  cursor: pointer; transition: background 0.12s;
}
.cal-foot-del:hover    { background: #fdf0ee; }
.cal-foot-cancel:hover { background: #f5f5f5; }
.cal-foot-ok:hover     { background: #eef2fa; }

/* ── Sheets Sync ── */
.sync-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  background: #f0f4fa;
  border: 1px solid #c8d8f0;
  border-radius: 8px;
  flex-shrink: 0;
}
.sync-url-input {
  flex: 1; min-width: 0;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.68rem;
  border: none; background: transparent;
  color: var(--ink); outline: none;
  padding: 2px 0;
}
.sync-url-input::placeholder { color: var(--line); }
.sync-status {
  font-size: 0.65rem; color: var(--ink2);
  white-space: nowrap; flex-shrink: 0;
  display: flex; align-items: center; gap: 3px;
}
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #ccc; flex-shrink: 0;
  transition: background 0.3s;
}
.sync-dot.ok  { background: #2c7a4b; }
.sync-dot.err { background: #c0392b; }
.sync-dot.loading { background: #e67e22; animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.sync-btn {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.68rem; font-weight: 600;
  border: none; border-radius: 5px;
  padding: 4px 8px; cursor: pointer;
  white-space: nowrap; flex-shrink: 0;
  transition: opacity 0.15s;
}
.sync-btn:hover { opacity: 0.8; }
.sync-btn-pull { background: #4a6fa5; color: #fff; }
.sync-btn-push { background: #2c7a4b; color: #fff; }

/* ── Mini year nav in sidebar ── */
.list-year-bar {
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; gap: 6px;
}
.list-section-label {
  font-size: 0.63rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink2); font-weight: 600;
}
.list-year-nav {
  display: flex; align-items: center; gap: 4px;
}
.list-year-display {
  font-size: 0.75rem; font-weight: 700; color: var(--ink);
  min-width: 36px; text-align: center;
}
.list-year-btn {
  background: none; border: none; cursor: pointer;
  color: var(--ink2); font-size: 0.85rem; padding: 1px 5px;
  border-radius: 4px; line-height: 1;
  transition: background 0.12s, color 0.12s;
}
.list-year-btn:hover { background: var(--hover); color: var(--ink); }
.list-clear-btn {
  font-size: 0.68rem; padding: 3px 8px;
}
</style>
</head>
<body>

<aside class="sidebar">
  <div><h1>연간<br>스케줄러</h1></div>

  <div>
    <div class="sidebar-label">기간 설정</div>
    <div class="date-picker-row">
      <div class="date-pick-btn" id="startPickBtn">
        <div class="date-pick-label">시작일</div>
        <div class="date-pick-val empty" id="startPickVal">날짜 선택</div>
      </div>
      <span class="date-arrow">→</span>
      <div class="date-pick-btn" id="endPickBtn">
        <div class="date-pick-label">종료일</div>
        <div class="date-pick-val empty" id="endPickVal">날짜 선택</div>
      </div>
    </div>
  </div>

<!-- Calendar popup -->
  <div class="cal-overlay" id="calOverlay"></div>
  <div class="cal-popup" id="calPopup">
    <div class="cal-header">
      <div class="cal-header-year-row" id="calYearRow">
        <span id="calYearTxt"></span>
        <span id="calYearArrow">▾</span>
      </div>
      <div class="cal-header-main" id="calHeaderMain">날짜 선택</div>
    </div>
    <div class="cal-year-list" id="calYearList"></div>
    <div class="cal-month-view" id="calMonthView">
      <div class="cal-month-inner" id="calMonthInner">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="calPrev">‹</button>
          <div class="cal-nav-lbl" id="calNavLbl"></div>
          <button class="cal-nav-btn" id="calNext">›</button>
        </div>
        <div class="cal-wdays">
          <span>일</span><span>월</span><span>화</span>
          <span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
    <div class="cal-footer">
      <button class="cal-foot-del"    id="calDel">삭제</button>
      <button class="cal-foot-cancel" id="calCancel">취소</button>
      <button class="cal-foot-ok"     id="calOk">설정</button>
    </div>
  </div>
  <div>
    <div class="sidebar-label">색상</div>
    <div class="color-swatches" id="swatches">
      <div class="swatch active" data-color="#5b4fcf" style="background:#5b4fcf"></div>
      <div class="swatch" data-color="#2c5f8a" style="background:#2c5f8a"></div>
      <div class="swatch" data-color="#8a2c2c" style="background:#8a2c2c"></div>
      <div class="swatch" data-color="#2c7a4b" style="background:#2c7a4b"></div>
      <div class="swatch" data-color="#7a5c2c" style="background:#7a5c2c"></div>
      <div class="swatch" data-color="#5c2c7a" style="background:#5c2c7a"></div>
      <div class="swatch" data-color="#1a7a7a" style="background:#1a7a7a"></div>
      <div class="swatch" data-color="#1c1814" style="background:#1c1814"></div>
    </div>
  </div>

  <div>
    <div class="sidebar-label">할 일 메모</div>
    <input type="text" id="arcLabel" placeholder="예: PSAT 준비, 회계 공부…" />
  </div>

  <button class="btn btn-primary" id="addBtn">＋ 포물선 추가</button>

  <hr class="divider">

  <div>
    <div class="sidebar-label">저장 / 불러오기</div>
    <div class="btn-row">
      <button class="btn btn-save" id="saveBtn">💾 저장</button>

        placeholder="https://script.google.com/macros/s/AKfycbxPqSbwjjMYcJx1aZAnlb6YQSlVvhcJfXE0j1sFa9hWpFXKWPlUH_dL7X9XnUOzHij9vQ/exec" />
      <button class="sync-btn sync-btn-pull" id="syncPullBtn" title="시트에서 불러오기">↓ 가져오기</button>
      <button class="sync-btn sync-btn-push" id="syncPushBtn" title="시트에 저장하기">↑ 저장</button>

    <!-- Row 1: "일정 목록" label + mini year nav + 전체삭제 -->

        <button class="list-year-btn" id="listYearPrev">‹</button>

<div class="toast" id="toast"></div>

  <span id="panelToggleIcon">⊙</span>
  <span id="panelToggleText">기간 설정 열기</span>

<script>
// ── Layout constants ──
const CELL_H      = 80;   // px per month cell
const LINE_X      = 48;   // x of the vertical timeline line in SVG
const YEAR_H      = 32;   // height of year label area
const TICK_LEN    = 10;   // tick extends right from LINE_X
const FONT_SIZE   = 16;   // month number font size
const DAYS_IN_MONTH = [0,31,28,31,30,31,30,31,31,30,31,30,31];
const TOTAL_H     = YEAR_H + 12 * CELL_H + 10;

let arcs = [];
let selectedColor = '#5b4fcf';
let selectedArcId = null;
let currentYear = new Date().getFullYear();
let listYear   = new Date().getFullYear();  // year shown in sidebar list



// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ════════════════════════════════════════
// Calendar Picker
// ════════════════════════════════════════
const DOW_KO = ['일','월','화','수','목','금','토'];

let pickedStart = null;
let pickedEnd   = null;
let calTarget   = null;
let calVY = new Date().getFullYear();
let calVM = new Date().getMonth() + 1;
let calSel = null;            // { year, month, day }
let calYearOpen = false;

const _today = new Date();

function _dim(y, m) { return new Date(y, m, 0).getDate(); }

function _dow(y, m, d) { return DOW_KO[new Date(y, m-1, d).getDay()]; }

function _fmt(o) {
  return o ? `${o.year}년 ${o.month}월 ${o.day}일` : '날짜 선택';
}

function _updateBtns() {
  const sv = document.getElementById('startPickVal');
  const ev = document.getElementById('endPickVal');
  sv.textContent = _fmt(pickedStart);
  sv.classList.toggle('empty', !pickedStart);
  ev.textContent = _fmt(pickedEnd);
  ev.classList.toggle('empty', !pickedEnd);
}

// ── Open / Close ──
function openCal(target) {
  calTarget = target;
  const ex = target === 'start' ? pickedStart : pickedEnd;
  calSel  = ex ? { ...ex } : null;
  calVY   = ex ? ex.year  : _today.getFullYear();
  calVM   = ex ? ex.month : (_today.getMonth() + 1);
  calYearOpen = false;

  document.getElementById('startPickBtn').classList.toggle('active', target === 'start');
  document.getElementById('endPickBtn').classList.toggle('active',   target === 'end');
  document.getElementById('calYearList').classList.remove('show');
  document.getElementById('calMonthView').style.display = '';
  document.getElementById('calYearArrow').textContent = '▾';

  document.getElementById('calOverlay').classList.add('show');
  document.getElementById('calPopup').classList.add('show');
  _renderCal();
}

function closeCal() {
  document.getElementById('calOverlay').classList.remove('show');
  document.getElementById('calPopup').classList.remove('show');
  document.getElementById('startPickBtn').classList.remove('active');
  document.getElementById('endPickBtn').classList.remove('active');
  calTarget = null;
}

// ── Render calendar ──
function _renderCal() {
  const y = calVY, m = calVM;

  // Header
  document.getElementById('calYearTxt').textContent = y + '년';
  if (calSel) {
    document.getElementById('calHeaderMain').textContent =
      `${calSel.month}월 ${calSel.day}일 (${_dow(calSel.year, calSel.month, calSel.day)})`;
  } else {
    document.getElementById('calHeaderMain').textContent =
      calTarget === 'start' ? '시작일 선택' : '종료일 선택';
  }
  document.getElementById('calNavLbl').textContent = `${y}년 ${m}월`;

  // Grid — 42 cells
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDow  = new Date(y, m-1, 1).getDay();
  const total     = _dim(y, m);
  const prevTotal = _dim(y, m === 1 ? 12 : m-1);

  // Prev month tail (dimmed, not clickable)
  for (let i = firstDow - 1; i >= 0; i--) {
    const c = document.createElement('div');
    c.className = 'cal-cell dim';
    c.textContent = prevTotal - i;
    grid.appendChild(c);
  }

  // Current month
  for (let day = 1; day <= total; day++) {
    const c    = document.createElement('div');
    const dow  = new Date(y, m-1, day).getDay();
    let cls = 'cal-cell';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    const isTod = day === _today.getDate() && m === _today.getMonth()+1 && y === _today.getFullYear();
    const isPick = calSel && calSel.year === y && calSel.month === m && calSel.day === day;
    if (isPick)      cls += ' pick';
    else if (isTod)  cls += ' now';
    c.className   = cls;
    c.textContent = day;
    c.addEventListener('click', () => {
      calSel = { year: y, month: m, day };
      _renderCal();
    });
    grid.appendChild(c);
  }

  // Next month leading (dimmed)
  const filled = firstDow + total;
  for (let i = 1; i <= 42 - filled; i++) {
    const c = document.createElement('div');
    c.className = 'cal-cell dim';
    c.textContent = i;
    grid.appendChild(c);
  }
}

// ── Month navigation with slide animation ──
function _goMonth(dir) {
  const inner = document.getElementById('calMonthInner');
  inner.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
  inner.style.transform  = dir > 0 ? 'translateX(-20px)' : 'translateX(20px)';
  inner.style.opacity    = '0';

  setTimeout(() => {
    calVM += dir;
    if (calVM < 1)  { calVM = 12; calVY--; }
    if (calVM > 12) { calVM = 1;  calVY++; }
    _renderCal();

    inner.style.transition = 'none';
    inner.style.transform  = dir > 0 ? 'translateX(20px)' : 'translateX(-20px)';
    inner.style.opacity    = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      inner.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
      inner.style.transform  = 'translateX(0)';
      inner.style.opacity    = '1';
    }));
  }, 150);
}

document.getElementById('calPrev').addEventListener('click', () => _goMonth(-1));
document.getElementById('calNext').addEventListener('click', () => _goMonth(+1));

// ── Touch/mouse swipe on month view ──
(function() {
  const mv = document.getElementById('calMonthView');
  let tx = null, ty = null;
  mv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  mv.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) _goMonth(dx < 0 ? 1 : -1);
    tx = null;
  }, { passive: true });
  let mx = null;
  mv.addEventListener('mousedown', e => { mx = e.clientX; });
  mv.addEventListener('mouseup',   e => {
    if (mx !== null && Math.abs(e.clientX - mx) > 40) _goMonth(e.clientX < mx ? 1 : -1);
    mx = null;
  });
})();

// ── Year picker ──
document.getElementById('calYearRow').addEventListener('click', () => {
  calYearOpen = !calYearOpen;
  const list = document.getElementById('calYearList');
  const mv   = document.getElementById('calMonthView');
  document.getElementById('calYearArrow').textContent = calYearOpen ? '▴' : '▾';
  if (calYearOpen) {
    list.classList.add('show');
    mv.style.display = 'none';
    list.innerHTML = '';
    for (let y = calVY - 8; y <= calVY + 8; y++) {
      const row = document.createElement('div');
      row.className = 'cal-year-row' + (y === calVY ? ' cur' : '');
      row.textContent = y;
      row.addEventListener('click', () => {
        calVY = y; calYearOpen = false;
        list.classList.remove('show');
        mv.style.display = '';
        document.getElementById('calYearArrow').textContent = '▾';
        _renderCal();
      });
      list.appendChild(row);
    }
    requestAnimationFrame(() => {
      const cur = list.querySelector('.cur');
      if (cur) cur.scrollIntoView({ block: 'center', behavior: 'instant' });
    });
  } else {
    list.classList.remove('show');
    mv.style.display = '';
  }
});

// ── Footer ──
document.getElementById('calOk').addEventListener('click', () => {
  if (!calSel) { showToast('날짜를 선택해주세요'); return; }
  if (calTarget === 'start') pickedStart = { ...calSel };
  else                        pickedEnd   = { ...calSel };
  _updateBtns();
  closeCal();
});
document.getElementById('calCancel').addEventListener('click', closeCal);
document.getElementById('calDel').addEventListener('click', () => {
  if (calTarget === 'start') pickedStart = null;
  else                        pickedEnd   = null;
  _updateBtns();
  closeCal();
});
document.getElementById('calOverlay').addEventListener('click', closeCal);

// ── Open triggers ──
document.getElementById('startPickBtn').addEventListener('click', () => openCal('start'));
document.getElementById('endPickBtn').addEventListener('click',   () => openCal('end'));

// Alias for addArc compatibility
function updatePickBtns() { _updateBtns(); }
updatePickBtns();

function tickY(month) {
  // month 1..13
  return YEAR_H + (month - 1) * CELL_H;
}

function getY(month, day) {
  const daysInM = DAYS_IN_MONTH[month] || 30;
  // day 1 → tickY(month), day last → tickY(month+1)
  const frac = (day - 1) / daysInM;
  return tickY(month) + frac * CELL_H;
}

function dateLabel(y, m, d) { return `${y}/${m}/${d}`; }

// ── SVG helpers ──
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// ── Draw static timeline ──
function drawTimeline(svg) {
  const g = el('g', { id: 'timeline-static' });

  // Year label
  const yearTxt = el('text', {
    x: LINE_X - 4, y: YEAR_H - 6,
    'text-anchor': 'end',
    'font-family': 'Playfair Display, serif',
    'font-size': '13',
    fill: '#6b5e52',
    'letter-spacing': '1'
  });
  yearTxt.textContent = currentYear;
  g.appendChild(yearTxt);

  // Vertical line: from first tick (YEAR_H) to last tick (YEAR_H + 12*CELL_H)
  g.appendChild(el('line', {
    x1: LINE_X, y1: tickY(1),
    x2: LINE_X, y2: tickY(13),
    stroke: '#1c1814', 'stroke-width': '1.5', 'stroke-linecap': 'round'
  }));

  // Month ticks + labels
  for (let m = 1; m <= 12; m++) {
    const y = tickY(m);
    // tick
    g.appendChild(el('line', {
      x1: LINE_X, y1: y, x2: LINE_X + TICK_LEN, y2: y,
      stroke: '#1c1814', 'stroke-width': '1.5', 'stroke-linecap': 'round'
    }));
    // label
    const txt = el('text', {
      x: LINE_X - 6, y: y + 4,
      'text-anchor': 'end',
      'font-family': 'Playfair Display, serif',
      'font-size': FONT_SIZE,
      fill: '#1c1814'
    });
    txt.textContent = m;
    g.appendChild(txt);
  }

  // End cap tick at month 13
  const yEnd = tickY(13);
  g.appendChild(el('line', {
    x1: LINE_X, y1: yEnd, x2: LINE_X + TICK_LEN, y2: yEnd,
    stroke: '#1c1814', 'stroke-width': '1.5', 'stroke-linecap': 'round'
  }));

  svg.appendChild(g);
}

// ── Render ──
function renderAll() {
  const svg = document.getElementById('mainSvg');

  // Filter arcs visible in currentYear
  // An arc spans [sy/sm/sd .. ey/em/ed]; show the portion that falls in currentYear
  const visibleArcs = arcs.filter(arc => {
    const sy = arc.sy ?? arc.sm; // fallback for old data without sy
    const ey = arc.ey ?? arc.em;
    const startTs = (sy  || currentYear) * 10000 + arc.sm * 100 + arc.sd;
    const endTs   = (ey  || currentYear) * 10000 + arc.em * 100 + arc.ed;
    const yearStart = currentYear * 10000 + 0101;
    const yearEnd   = currentYear * 10000 + 1231;
    return startTs <= yearEnd && endTs >= yearStart;
  });

  // For each visible arc, clamp months to currentYear
  function clampArc(arc) {
    const sy = arc.sy ?? currentYear;
    const ey = arc.ey ?? currentYear;
    let sm = arc.sm, sd = arc.sd;
    let em = arc.em, ed = arc.ed;
    if (sy < currentYear) { sm = 1; sd = 1; }
    if (ey > currentYear) { em = 12; ed = 31; }
    return { ...arc, sm, sd, em, ed };
  }

  // Column assignment (greedy, no overlap)
  const columns = [];
  for (const arc of visibleArcs) {
    const ca = clampArc(arc);
    const s = ca.sm * 10000 + ca.sd;
    let placed = false;
    for (const col of columns) {
      const last = clampArc(col[col.length - 1]);
      if (s > last.em * 10000 + last.ed) { col.push(arc); placed = true; break; }
    }
    if (!placed) columns.push([arc]);
  }
  const arcCol = {};
  columns.forEach((col, ci) => col.forEach(a => arcCol[a.id] = ci));

  const numCols = Math.max(1, columns.length);
  const svgW = LINE_X + numCols * 70 + 220;

  svg.setAttribute('width',  svgW);
  svg.setAttribute('height', TOTAL_H);
  svg.setAttribute('viewBox', `0 0 ${svgW} ${TOTAL_H}`);

  svg.innerHTML = '';
  drawTimeline(svg);

  // Draw arcs
  for (const arcRaw of visibleArcs) {
    const arc = clampArc(arcRaw);
    const col    = arcCol[arcRaw.id] ?? 0;
    const bulge  = LINE_X + 18 + col * 68;  // rightmost x of the arc
    const labelX = bulge + 14;

    // Exact pixel positions: arc starts/ends ON the timeline line (x = LINE_X)
    const y1   = getY(arc.sm, arc.sd);
    const y2   = getY(arc.em, arc.ed);
    const midY = (y1 + y2) / 2;
    const ht   = Math.abs(y2 - y1);

    // Smooth cubic bezier bracket: M(line,y1) → bulge → M(line,y2)
    // Control points: pull out to bulge at 40% of height from each end
    const ctrl = Math.max(ht * 0.45, 20);
    const pathD = `M ${LINE_X} ${y1} C ${bulge} ${y1 + ctrl}, ${bulge} ${y2 - ctrl}, ${LINE_X} ${y2}`;

    const isSelected = selectedArcId === arcRaw.id;

    const g = el('g');
    g.classList.add('arc-group');
    g.addEventListener('click', () => {
      selectedArcId = isSelected ? null : arcRaw.id;
      renderAll();
    });

    // Hit area (wider, transparent)
    const hit = el('path', { d: pathD, stroke: 'transparent', 'stroke-width': '16', fill: 'none' });
    g.appendChild(hit);

    // Visible arc
    const vis = el('path', {
      d: pathD,
      stroke: arc.color,
      'stroke-width': isSelected ? '2.4' : '1.7',
      fill: 'none',
      'stroke-linecap': 'round'
    });
    g.appendChild(vis);

    // Dots at exact start/end points on the line
    for (const y of [y1, y2]) {
      g.appendChild(el('circle', {
        cx: LINE_X, cy: y, r: '3.2',
        fill: arc.color, stroke: '#fffefa', 'stroke-width': '1.2'
      }));
    }

    // Text label via foreignObject
    const fo = el('foreignObject', {
      x: labelX, y: midY - 13, width: 200, height: 26
    });
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;height:100%';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'arc-label-input';
    inp.value = arcRaw.label;
    inp.placeholder = '할 일 입력';
    inp.style.color = arcRaw.color;
    inp.addEventListener('input', e => { arcRaw.label = e.target.value; saveToStorage(); renderList(); });
    inp.addEventListener('click', e => e.stopPropagation());
    wrap.appendChild(inp);
    fo.appendChild(wrap);
    g.appendChild(fo);

    // When selected: show ✕ 삭제 button above start point
    if (isSelected) {
      const delFo = el('foreignObject', {
        x: LINE_X + 6, y: y1 - 28, width: 72, height: 26
      });
      const delWrap = document.createElement('div');
      delWrap.style.cssText = 'display:flex;align-items:center;height:100%;';
      const delBtnSvg = document.createElement('button');
      delBtnSvg.textContent = '✕ 삭제';
      delBtnSvg.style.cssText = `
        font-family:'Noto Sans KR',sans-serif;
        font-size:0.7rem; font-weight:700;
        background:${arcRaw.color}; color:#fff;
        border:none; border-radius:20px;
        padding:4px 10px; cursor:pointer;
        white-space:nowrap;
        box-shadow:0 2px 8px rgba(0,0,0,0.22);
        pointer-events:all;
        line-height:1.2;
      `;
      delBtnSvg.addEventListener('click', e => {
        e.stopPropagation();
        deleteArc(arcRaw.id);
      });
      delWrap.appendChild(delBtnSvg);
      delFo.appendChild(delWrap);
      g.appendChild(delFo);
    }

    svg.appendChild(g);
  }

  renderList();
}

// Track which arc-item-wrap is currently revealed
let revealedWrapId = null;

function closeAllReveals() {
  document.querySelectorAll('.arc-item-wrap.reveal').forEach(w => w.classList.remove('reveal'));
  revealedWrapId = null;
}

function deleteArc(id) {
  arcs = arcs.filter(a => a.id !== id);
  if (selectedArcId === id) selectedArcId = null;
  saveToStorage();
  renderAll();
  showToast('삭제됐어요');
}

function renderList() {
  const list = document.getElementById('arcList');
  list.innerHTML = '';

  // Update mini year nav display
  const lyDisp = document.getElementById('listYearDisplay');
  if (lyDisp) lyDisp.textContent = listYear;

  // Filter arcs that overlap listYear
  const listArcs = arcs.filter(arc => {
    const sy = arc.sy ?? listYear, ey = arc.ey ?? listYear;
    return sy <= listYear && ey >= listYear;
  });

  document.getElementById('arcCount').textContent = `(${listArcs.length})`;

  if (!listArcs.length) {
    list.innerHTML = '<div style="font-size:0.74rem;color:var(--line);padding:8px 4px;">' + listYear + '년 일정이 없어요</div>';
    return;
  }

  [...listArcs].reverse().forEach(arc => {
    const item = document.createElement('div');
    item.className = 'arc-item' + (selectedArcId === arc.id ? ' selected' : '');

    const dot = document.createElement('div');
    dot.className = 'arc-dot';
    dot.style.background = arc.color;

    const info = document.createElement('div');
    info.className = 'arc-item-info';

    const text = document.createElement('div');
    text.className = 'arc-text';
    text.textContent = arc.label || '(미입력)';

    const dates = document.createElement('div');
    dates.className = 'arc-dates';
    const sy2 = arc.sy ?? currentYear, ey2 = arc.ey ?? currentYear;
    dates.textContent = `${dateLabel(sy2, arc.sm, arc.sd)} – ${dateLabel(ey2, arc.em, arc.ed)}`;

    info.appendChild(text);
    info.appendChild(dates);

    const delBtn = document.createElement('button');
    delBtn.className = 'arc-del-btn';
    delBtn.textContent = '✕';
    delBtn.title = '삭제';
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      deleteArc(arc.id);
    });

    item.appendChild(dot);
    item.appendChild(info);
    item.appendChild(delBtn);
    list.appendChild(item);

    item.addEventListener('click', () => {
      selectedArcId = selectedArcId === arc.id ? null : arc.id;
      renderAll();
    });
  });
}

function deleteArc(id) {
  arcs = arcs.filter(a => a.id !== id);
  if (selectedArcId === id) selectedArcId = null;
  saveToStorage();
  renderAll();
  showToast('삭제됐어요');
}

updatePickBtns();

// ── Add arc ──
function addArc() {
  if (!pickedStart) { showToast('시작일을 선택해주세요'); return; }
  if (!pickedEnd)   { showToast('종료일을 선택해주세요'); return; }

  const sy = pickedStart.year, sm = pickedStart.month, sd = pickedStart.day;
  const ey = pickedEnd.year,   em = pickedEnd.month,   ed = pickedEnd.day;

  if (sy * 10000 + sm * 100 + sd > ey * 10000 + em * 100 + ed) {
    showToast('종료일이 시작일보다 앞설 수 없어요'); return;
  }

  const label = document.getElementById('arcLabel').value.trim() || '할 일';
  arcs.push({ id: Date.now(), sy, sm, sd, ey, em, ed, color: selectedColor, label });
  document.getElementById('arcLabel').value = '';
  saveToStorage();
  renderAll();
  showToast('일정이 추가됐어요');
}

document.getElementById('addBtn').addEventListener('click', addArc);
document.getElementById('arcLabel').addEventListener('keydown', e => {
  if (e.key === 'Enter') addArc();
});

// ── localStorage 자동저장 ──
const LS_KEY = 'annual-scheduler-v2';

function saveToStorage() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ version: 2, arcs }));
  } catch(e) { /* storage full or private mode */ }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.arcs)) {
      arcs = data.arcs;
    }
  } catch(e) { /* ignore */ }
}

// ── 파일 저장 (JSON 내보내기) ──
document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ version: 2, arcs }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `schedule_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('파일로 저장 완료!');
});

// ── 파일 불러오기 ──
document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data.arcs)) {
        arcs = data.arcs; selectedArcId = null;
        saveToStorage();
        renderAll(); showToast('불러오기 완료!');
      } else throw 0;
    } catch { showToast('파일 형식이 올바르지 않아요'); }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── Init ──
function updateYearDisplay() {
  document.getElementById('yearDisplay').textContent = currentYear + '년';
  calViewYear = currentYear;
  // Sync list year with timeline year
  listYear = currentYear;
  renderList();
}

// ── Init UI handlers ──
document.addEventListener('DOMContentLoaded', () => {
  // Swatch color picker
  document.querySelectorAll('.swatch').forEach(s => {
    s.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
      selectedColor = s.dataset.color;
    });
  });

  // Sidebar list mini year nav
  const prev = document.getElementById('listYearPrev');
  const next = document.getElementById('listYearNext');
  if (prev) prev.addEventListener('click', () => { listYear--; renderList(); });
  if (next) next.addEventListener('click', () => { listYear++; renderList(); });

  // Clear button — delete only arcs overlapping listYear
  const clearBtn = document.getElementById('clearBtn');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      const toDelete = arcs.filter(arc => {
        const sy = arc.sy ?? listYear, ey = arc.ey ?? listYear;
        return sy <= listYear && ey >= listYear;
      });
      if (!toDelete.length) { showToast(listYear + '년 일정이 없어요'); return; }
      if (!confirm(listYear + '년 일정 ' + toDelete.length + '개를 모두 삭제할까요?')) return;
      const ids = new Set(toDelete.map(a => a.id));
      arcs = arcs.filter(a => !ids.has(a.id));
      if (ids.has(selectedArcId)) selectedArcId = null;
      saveToStorage();
      renderAll();
      showToast(listYear + '년 일정이 삭제됐어요');
    });
  }

  // Sheets sync UI init
  const savedUrl = localStorage.getItem(LS_SYNC_URL);
  if (savedUrl) {
    document.getElementById('syncUrlInput').value = savedUrl;
    setSyncStatus('idle', 'URL이 저장되어 있어요');
  }
  document.getElementById('syncPullBtn').addEventListener('click', syncPull);
  document.getElementById('syncPushBtn').addEventListener('click', syncPush);
  document.getElementById('syncUrlInput').addEventListener('change', () => {
    const v = document.getElementById('syncUrlInput').value.trim();
    if (v) localStorage.setItem(LS_SYNC_URL, v);
  });
});

// ── Mobile panel toggle ──
(function() {
  const sidebar  = document.querySelector('.sidebar');
  const mainEl   = document.querySelector('.main');
  const toggleBtn = document.getElementById('panelToggle');
  const toggleIcon = document.getElementById('panelToggleIcon');
  const toggleText = document.getElementById('panelToggleText');

  let isOpen = false; // sidebar starts collapsed on mobile

  function isMobile() { return window.innerWidth <= 700; }

  function setSidebarState(open) {
    isOpen = open;
    if (isMobile()) {
      if (open) {
        sidebar.classList.remove('collapsed');
        mainEl.classList.add('sidebar-open');
        // measure sidebar height and set CSS var
        const h = sidebar.getBoundingClientRect().height;
        mainEl.style.setProperty('--sidebar-h', h + 'px');
        toggleIcon.textContent = '✕';
        toggleText.textContent = '닫기';
      } else {
        sidebar.classList.add('collapsed');
        mainEl.classList.remove('sidebar-open');
        mainEl.style.removeProperty('--sidebar-h');
        toggleIcon.textContent = '＋';
        toggleText.textContent = '기간 설정';
      }
    } else {
      // Desktop: always visible, reset
      sidebar.classList.remove('collapsed');
      mainEl.classList.remove('sidebar-open');
    }
  }

  function onResize() {
    if (!isMobile()) {
      setSidebarState(true);
      toggleBtn.style.display = 'none';
    } else {
      toggleBtn.style.display = '';
      // keep current state on resize
    }
  }

  toggleBtn.addEventListener('click', () => setSidebarState(!isOpen));

  window.addEventListener('resize', onResize);

  // Init
  if (isMobile()) {
    setSidebarState(false); // start collapsed on mobile
  } else {
    toggleBtn.style.display = 'none';
  }
})();

document.getElementById('yearPrev').addEventListener('click', () => {
  currentYear--;
  updateYearDisplay();
  renderAll();
});
document.getElementById('yearNext').addEventListener('click', () => {
  currentYear++;
  updateYearDisplay();
  renderAll();
});

// localStorage에서 복원
loadFromStorage();
updateYearDisplay();
renderAll();


// ══════════════════════════════════════════
// Google Sheets 동기화
// ══════════════════════════════════════════
const LS_SYNC_URL = 'scheduler-sheets-url';

function getSyncUrl() {
  return document.getElementById('syncUrlInput').value.trim()
      || localStorage.getItem(LS_SYNC_URL) || '';
}

function setSyncStatus(state, text) {
  // state: 'idle' | 'ok' | 'err' | 'loading'
  const dot  = document.getElementById('syncDot');
  const txt  = document.getElementById('syncStatusText');
  dot.className = 'sync-dot' + (state !== 'idle' ? ' ' + state : '');
  txt.textContent = text;
}

// ── Pull from Sheets ──
async function syncPull() {
  const url = getSyncUrl();
  if (!url) { setSyncStatus('err', 'URL을 먼저 입력해주세요'); return; }
  localStorage.setItem(LS_SYNC_URL, url);

  setSyncStatus('loading', '불러오는 중…');
  try {
    const res  = await fetch(url, { method: 'GET', redirect: 'follow' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    arcs = data.arcs || [];
    selectedArcId = null;
    saveToStorage();
    renderAll();
    setSyncStatus('ok', `✓ ${arcs.length}개 불러옴 (${new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})})`);
    showToast('시트에서 불러왔어요!');
  } catch(e) {
    setSyncStatus('err', '오류: ' + e.message.slice(0, 40));
    showToast('불러오기 실패: ' + e.message.slice(0, 30));
  }
}

// ── Push to Sheets ──
async function syncPush() {
  const url = getSyncUrl();
  if (!url) { setSyncStatus('err', 'URL을 먼저 입력해주세요'); return; }
  localStorage.setItem(LS_SYNC_URL, url);

  setSyncStatus('loading', '저장 중…');
  try {
    const res  = await fetch(url, {
      method:  'POST',
      redirect: 'follow',
      body:    JSON.stringify({ arcs }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    setSyncStatus('ok', `✓ ${data.count}개 저장됨 (${new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})})`);
    showToast('시트에 저장됐어요!');
  } catch(e) {
    setSyncStatus('err', '오류: ' + e.message.slice(0, 40));
    showToast('저장 실패: ' + e.message.slice(0, 30));
  }
}
